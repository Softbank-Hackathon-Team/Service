# Z77 DRAFT(ai): B' 데모용 Postgres 두 개 (GKE). 운영자(CNPG)·RBAC·IAM 없이 기본 자원만: Deployment·Service.
#   z77-src = 출발, z77-dst = 도착(2안). 1안(도착 = Cloud SQL)이면 z77-dst 는 replicas 0 으로 둔다.
#   먼저 만들 것 (CHANGES §4-2): 네임스페이스 z77, Secret z77-pg(password), ConfigMap z77-pg-init(repl-pg-init.sh)
#   공개 LB 는 loadBalancerSourceRanges 로 맥 공인 IP 등만 연다 (명령으로 patch). 데이터는 emptyDir (데모 끝나면 지움)
apiVersion: apps/v1
kind: Deployment
metadata: { name: z77-src, namespace: z77, labels: { app: z77-pg, role: src } }
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector: { matchLabels: { app: z77-pg, role: src } }
  template:
    metadata: { labels: { app: z77-pg, role: src } }
    spec:
      containers:
        - name: pg
          image: mirror.gcr.io/library/postgres:16
          env:
            - { name: POSTGRES_DB, value: shop }
            - { name: POSTGRES_PASSWORD, valueFrom: { secretKeyRef: { name: z77-pg, key: password } } }
            - { name: PGDATA, value: /var/lib/postgresql/data/pgdata }
          ports: [{ containerPort: 5432 }]
          readinessProbe: { exec: { command: ["pg_isready", "-U", "postgres"] }, periodSeconds: 5 }
          resources: { requests: { cpu: 250m, memory: 512Mi } }
          volumeMounts:
            - { name: data, mountPath: /var/lib/postgresql/data }
            - { name: init, mountPath: /docker-entrypoint-initdb.d, readOnly: true }
      volumes:
        - { name: data, emptyDir: {} }
        - { name: init, configMap: { name: z77-pg-init, defaultMode: 0755 } }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: z77-dst, namespace: z77, labels: { app: z77-pg, role: dst } }
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector: { matchLabels: { app: z77-pg, role: dst } }
  template:
    metadata: { labels: { app: z77-pg, role: dst } }
    spec:
      containers:
        - name: pg
          image: mirror.gcr.io/library/postgres:16
          env:
            - { name: POSTGRES_DB, value: shop }
            - { name: POSTGRES_PASSWORD, valueFrom: { secretKeyRef: { name: z77-pg, key: password } } }
            - { name: PGDATA, value: /var/lib/postgresql/data/pgdata }
          ports: [{ containerPort: 5432 }]
          readinessProbe: { exec: { command: ["pg_isready", "-U", "postgres"] }, periodSeconds: 5 }
          resources: { requests: { cpu: 250m, memory: 512Mi } }
          volumeMounts:
            - { name: data, mountPath: /var/lib/postgresql/data }
            - { name: init, mountPath: /docker-entrypoint-initdb.d, readOnly: true }
      volumes:
        - { name: data, emptyDir: {} }
        - { name: init, configMap: { name: z77-pg-init, defaultMode: 0755 } }
---
# 클러스터 안 이름 (DB↔DB 구독용, 2안): z77-src.z77.svc / z77-dst.z77.svc
apiVersion: v1
kind: Service
metadata: { name: z77-src, namespace: z77 }
spec: { selector: { app: z77-pg, role: src }, ports: [{ port: 5432, targetPort: 5432 }] }
---
apiVersion: v1
kind: Service
metadata: { name: z77-dst, namespace: z77 }
spec: { selector: { app: z77-pg, role: dst }, ports: [{ port: 5432, targetPort: 5432 }] }
---
# 공개 LB (맥 워커용, 1안이면 Cloud SQL 의 나가는 IP 도). 처음엔 문서용 주소만 → 명령으로 맥 IP 로 patch
apiVersion: v1
kind: Service
metadata: { name: z77-src-lb, namespace: z77 }
spec:
  type: LoadBalancer
  externalTrafficPolicy: Local
  loadBalancerSourceRanges: ["192.0.2.1/32"]
  selector: { app: z77-pg, role: src }
  ports: [{ port: 5432, targetPort: 5432 }]
---
apiVersion: v1
kind: Service
metadata: { name: z77-dst-lb, namespace: z77 }
spec:
  type: LoadBalancer
  externalTrafficPolicy: Local
  loadBalancerSourceRanges: ["192.0.2.1/32"]
  selector: { app: z77-pg, role: dst }
  ports: [{ port: 5432, targetPort: 5432 }]
