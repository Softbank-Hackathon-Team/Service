{{- /* 앱 파드 서비스 계정. 권한은 Terraform aws_eks_pod_identity_association.worker·api 가 이름으로 묶는다 (어노테이션 없음). agent-worker 는 클라우드 권한이 없고 샌드박스 호스트 권한만 받는다 (agent-worker-rbac.yaml) */}}
{{- range list "worker" "api" "agent-worker" }}
