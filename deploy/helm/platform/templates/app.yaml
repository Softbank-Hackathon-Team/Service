{{- $apps := .Values.apps }}
{{- /* helm upgrade --reuse-values 는 이전 릴리스 값만 쓴다. 이 칸이 생기기 전 릴리스면 값이 없어도 렌더가 돌아야 한다 */}}
{{- $gcp := default dict .Values.gcpPlatform }}
{{- $sbx := default dict .Values.sandbox }}
{{- $rehearsal := default dict $sbx.rehearsal }}
{{- $gvisor := default dict $sbx.gvisor }}
{{- $remediation := default dict .Values.agentRemediation }}
{{- with $remediation.sandboxMode }}
{{- if not (has . (list "memory" "vcluster")) }}
{{- fail (printf "agentRemediation.sandboxMode 는 memory 또는 vcluster (받은 값 %q)" .) }}
{{- end }}
{{- if and (eq . "vcluster") (not (and $sbx.enabled $gvisor.enabled)) }}
{{- fail "agentRemediation.sandboxMode=vcluster 는 sandbox.enabled·sandbox.gvisor.enabled 와 같이 켠다 (수정 실행 파드는 gVisor 만 받는다)" }}
{{- end }}
{{- end }}
{{- if and $rehearsal.enabled (not $sbx.enabled) }}
{{- fail "sandbox.rehearsal.enabled 는 sandbox.enabled 와 같이 켠다 (리허설은 sandbox 노드·호스트 가드·agent-worker 권한이 있어야 돈다)" }}
{{- end }}
{{- $traffic := default dict .Values.trafficMetrics }}
{{- $hubRoleArn := (default dict .Values.argocd).hubRoleArn | default "" }}
{{- if and $hubRoleArn (not (regexMatch "^arn:aws:iam::[0-9]{12}:role/.+$" $hubRoleArn)) }}
{{- fail (printf "argocd.hubRoleArn 은 Terraform 출력 argocd_hub_role_arn 그대로 (IAM 역할 ARN, 받은 값 %q)" $hubRoleArn) }}
{{- end }}
{{- /* 비밀 아닌 설정 (values apps.<이름>.env, 이름: 값). 그 앱 env 맨 뒤에 그대로 붙는다. 아래 셋은 렌더를 멈춘다:
       1) 차트가 넣는 이름 = 아래 env 블록의 이름 전부. 지금 꺼져 있어도 막는다 (traffic.mock·sandbox.rehearsal 같은 켜기 값과 가드를 건너뛰지 못하게)
          env 블록에 이름을 더하면 여기에도 더한다 (deploy/ci/check-platform.sh 가 둘을 맞춰 본다)
       2) 그 앱이 이미 비밀(<이름>-env, components.<이름>.secretKeys)로 받는 이름. env 가 envFrom 을 덮어 값이 두 곳이 된다
       3) 비밀처럼 보이는 이름 (*_TOKEN·*_SECRET·*_PASSWORD·*_KEY·*DATABASE_URL). 비밀은 platform/app JSON + secretKeys 로만 넣는다
       DRAFT(ai): 이름은 대문자·숫자·_ 만 받는다 (소문자 jwt_secret 같은 이름이 3) 을 비껴가지 못하게) */}}
{{- $chartEnv := list "HOME" "API_PORT" "METRICS_PORT" "WORKER_METRICS_PORT" "TF_WORK_DIR" "API_UPSTREAM" "API_PREFIX" "ARGO_HUB_ROLE_ARN" "GCP_PLATFORM_PROJECT" "CLOUDSDK_AUTH_CREDENTIAL_FILE_OVERRIDE" "SANDBOX_REHEARSAL" "SANDBOX_IMAGE_REGISTRY" "SANDBOX_RUNTIME_CLASS" "SANDBOX_MODE" "TRAFFIC_METRICS_ENDPOINT" "PROM_URL" "MOCK_TRAFFIC" "ENV_LAYER_AUTO" }}
{{- $extraEnv := dict }}
{{- range $name := list "api" "worker" "agent-worker" "web" }}
{{- /* 이 칸이 생기기 전 릴리스 값(--reuse-values)이면 env 가 없다 → 빈 맵 */}}
{{- $env := (default dict (index $apps $name)).env | default dict }}
{{- if not (kindIs "map" $env) }}
{{- fail (printf "apps.%s.env 는 이름: 값 맵 (받은 값 %v)" $name $env) }}
{{- end }}
{{- $secretKeys := (default dict (index (default dict $.Values.components) $name)).secretKeys | default list }}
{{- if and (eq $name "agent-worker") $remediation.gitopsRead }}
{{- $secretKeys = concat $secretKeys (list "GITOPS_REPO_URL" "GITOPS_READ_TOKEN") }}
{{- end }}
{{- $out := dict }}
{{- range $k, $v := $env }}
{{- /* null = 빼기. 차트 기본에 없는 이름은 helm 이 null 을 지우지 않고 남긴다 (--set apps.worker.env.X=null) */}}
{{- if not (kindIs "invalid" $v) }}
{{- if not (regexMatch "^[A-Z_][A-Z0-9_]*$" $k) }}
{{- fail (printf "apps.%s.env.%s: 이름은 대문자·숫자·_ 만 (예 STEP_CONCURRENCY)" $name $k) }}
{{- end }}
{{- if has $k $chartEnv }}
{{- fail (printf "apps.%s.env.%s: 차트가 넣는 이름이다. 그 값(values)으로 바꾼다 (README \"앱 배포\")" $name $k) }}
{{- end }}
{{- if has $k $secretKeys }}
{{- fail (printf "apps.%s.env.%s: 이미 비밀(components.%s.secretKeys)로 받는 이름이다. 한 곳에서만 준다" $name $k $name) }}
{{- end }}
{{- if regexMatch "(^|_)(TOKEN|SECRET|PASSWORD|KEY|DATABASE_URL)$" $k }}
{{- fail (printf "apps.%s.env.%s: 비밀처럼 보이는 이름이다. platform/app JSON 에 넣고 components.%s.secretKeys 에 더한다" $name $k $name) }}
{{- end }}
{{- if or (kindIs "map" $v) (kindIs "slice" $v) }}
{{- fail (printf "apps.%s.env.%s: 값은 글자·숫자·참거짓 하나 (받은 값 %v)" $name $k $v) }}
{{- end }}
{{- /* 값 파일의 숫자는 float64 로 들어와 1000000 이 "1e+06" 이 된다. 정수면 정수 글자로 */}}
{{- $s := toString $v }}
{{- if and (kindIs "float64" $v) (eq (float64 (int64 $v)) $v) }}
{{- $s = printf "%d" (int64 $v) }}
{{- end }}
{{- $_ := set $out $k $s }}
{{- end }}
{{- end }}
{{- $_ := set $extraEnv $name $out }}
{{- end }}
{{- /* 플랫폼 앱 4개. 이미지 registry·tag 는 배포 때 준다. 둘 중 하나라도 비어 있으면 앱을 하나도 안 만든다 (값 없이도 비밀·입구 차트는 검사된다) */}}
{{- if and $apps.image.registry $apps.image.tag }}
{{- /* 앱마다 고정인 것: 실행 사용자(이미지 USER), 검사 경로, 쓰기 자리. 값으로 빼지 않는다 (이미지와 같이 바뀐다)
       api·worker·agent-worker: deploy/docker/Dockerfile USER node(1000). web: apps/web/Dockerfile USER 101 (nginx-unprivileged) */}}
{{- $fixed := dict
      "api"          (dict "uid" 1000 "node" true)
      "worker"       (dict "uid" 1000 "node" true)
      "agent-worker" (dict "uid" 1000 "node" true)
      "web"          (dict "uid" 101  "node" false) }}
{{- range $name := list "api" "worker" "agent-worker" "web" }}
{{- $a := index $apps $name }}
{{- $f := index $fixed $name }}
{{- if $a.enabled }}
{{- $tfDisk := and (eq $name "worker") (default dict $a.tfWorkDir).size }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    app.kubernetes.io/name: {{ $name }}
    app.kubernetes.io/part-of: platform
spec:
  replicas: {{ $a.replicas }}
  {{- if $tfDisk }}
  # EBS 는 파드 하나만 붙는다. 새 파드를 먼저 띄우면 디스크를 못 붙여 멈춘다
  strategy: { type: Recreate }
  {{- end }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ $name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ $name }}
        app.kubernetes.io/part-of: platform
    spec:
      {{- with $a.serviceAccount }}
      serviceAccountName: {{ . }}
      {{- end }}
      automountServiceAccountToken: {{ $a.automountServiceAccountToken }}
      {{- with $a.terminationGracePeriodSeconds }}
      terminationGracePeriodSeconds: {{ . }}
      {{- end }}
      nodeSelector:
        pool: {{ $a.pool }}
      {{- /* general 만 taint 가 없다. 나머지는 dedicated=<pool>:NoSchedule (infra/modules/aws/platform/main.tf aws_eks_node_group.this) */}}
      {{- if ne $a.pool "general" }}
      tolerations:
        - { key: dedicated, operator: Equal, value: {{ $a.pool }}, effect: NoSchedule }
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: {{ $f.uid }}
        runAsGroup: {{ $f.uid }}
        {{- if $tfDisk }}
        fsGroup: {{ $f.uid }}
        {{- end }}
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: {{ $name }}
          image: {{ printf "%s/svc-%s:%s" $apps.image.registry $name $apps.image.tag }}
          {{- /* 실행 명령은 이미지 CMD 그대로 (node --enable-source-maps main.mjs / nginx) */}}
          {{- if hasKey $.Values.components $name }}
          envFrom:
            - secretRef: { name: {{ $name }}-env }
          {{- end }}
          env:
            {{- if $f.node }}
            # DRAFT(ai): 뿌리 파일 시스템이 읽기 전용이라 /home/node 에 못 쓴다. git·helm·kubectl 캐시와 작업 폴더가 /tmp(emptyDir) 아래로 가게
            - { name: HOME, value: /tmp }
            {{- end }}
            {{- if eq $name "api" }}
            - { name: API_PORT, value: {{ $a.port | quote }} }
            - { name: METRICS_PORT, value: {{ $a.metricsPort | quote }} }
            {{- else if eq $name "worker" }}
            - { name: WORKER_METRICS_PORT, value: {{ $a.metricsPort | quote }} }
            {{- if $tfDisk }}
            - { name: TF_WORK_DIR, value: /var/lib/svc-tf }
            {{- end }}
            {{- else if eq $name "web" }}
            # nginx 템플릿(deploy/docker/web-nginx.conf.template)이 /api/* 를 여기로 보낸다
            - { name: API_UPSTREAM, value: {{ printf "http://api:%v" $apps.api.port | quote }} }
            - { name: API_PREFIX, value: /api/v1 }
            {{- end }}
            {{- if and $hubRoleArn (has $name (list "api" "worker")) }}
            # Argo CD 허브 역할 (values argocd.hubRoleArn). api = 연결 링크 ArgoHubRoleArn, worker = EKS 허브 RoleBinding·cluster Secret
            - { name: ARGO_HUB_ROLE_ARN, value: {{ $hubRoleArn | quote }} }
            {{- end }}
            {{- with $gcp.project }}
            {{- if has $name (list "api" "worker") }}
            - { name: GCP_PLATFORM_PROJECT, value: {{ . | quote }} }
            {{- end }}
            {{- if eq $name "worker" }}
            # gcloud 시작 자격 = svc-worker (templates/worker-gcp.yaml). 빌린 고객 토큰으로 부를 때는 gcpEnvFor 가 지운다
            - { name: CLOUDSDK_AUTH_CREDENTIAL_FILE_OVERRIDE, value: /var/run/gcp-cred/worker.json }
            {{- end }}
            {{- end }}
            {{- if and $sbx.enabled $rehearsal.enabled (eq $name "worker") }}
            # 리허설 켜기 (values sandbox.rehearsal). 복사 자리는 호스트 가드 sbx-pod-guard 와 같은 값 하나 (sandbox.imageRegistry)
            - { name: SANDBOX_REHEARSAL, value: "on" }
            - { name: SANDBOX_IMAGE_REGISTRY, value: {{ $sbx.imageRegistry | quote }} }
            {{- end }}
            {{- if and $sbx.enabled $gvisor.enabled (eq $name "agent-worker") }}
            # 샌드박스 파드 런타임 (values sandbox.gvisor). 호스트 가드 sbx-runtimeclass-guard 가 이 이름만 받는다
            - { name: SANDBOX_RUNTIME_CLASS, value: {{ $gvisor.runtimeClass | quote }} }
            {{- end }}
            {{- if and $remediation.sandboxMode (eq $name "agent-worker") }}
            # AI 점검 샌드박스 (values agentRemediation.sandboxMode). 비우면 agent-worker 기본(memory)
            - { name: SANDBOX_MODE, value: {{ $remediation.sandboxMode | quote }} }
            {{- end }}
            {{- if eq $name "worker" }}
            {{- with $traffic.endpoint }}
            - { name: TRAFFIC_METRICS_ENDPOINT, value: {{ . | quote }} }
            {{- end }}
            {{- with $traffic.promUrl }}
            - { name: PROM_URL, value: {{ . | quote }} }
            {{- end }}
            {{- if (default dict $.Values.traffic).mock }}
            # 흉내 트래픽 (values traffic.mock). 진짜 지표·전환기 없이 shifting 을 넘긴다
            - { name: MOCK_TRAFFIC, value: "1" }
            {{- end }}
            {{- if (default dict $.Values.envLayer).auto }}
            # GCP 도착 환경 층 자동 생성 (values envLayer.auto)
            - { name: ENV_LAYER_AUTO, value: "1" }
            {{- end }}
            {{- end }}
            {{- with index $extraEnv $name }}
            # 비밀 아닌 설정 (values apps.{{ $name }}.env)
            {{- range $k, $v := . }}
            - { name: {{ $k }}, value: {{ $v | quote }} }
            {{- end }}
            {{- end }}
          {{- if or $a.port $a.metricsPort }}
          ports:
            {{- with $a.port }}
            - { name: http, containerPort: {{ . }} }
            {{- end }}
            {{- with $a.metricsPort }}
            - { name: metrics, containerPort: {{ . }} }
            {{- end }}
          {{- end }}
          {{- if eq $name "api" }}
          # /healthz·/readyz 는 인증 훅이 건너뛴다 (apps/api/src/plugins/auth.ts). readyz 는 DB SELECT 1
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 10
            periodSeconds: 10
          {{- else if eq $name "worker" }}
          # 워커는 업무 HTTP 포트가 없다. 지표 서버는 작업 등록보다 먼저 연다 (apps/worker/src/main.ts)
          livenessProbe:
            httpGet: { path: /metrics, port: metrics }
            initialDelaySeconds: 15
            periodSeconds: 15
          {{- else if eq $name "agent-worker" }}
          # HTTP 포트가 없다. 이미지 HEALTHCHECK 와 같은 DB SELECT 1 (deploy/docker/healthcheck.mjs, 2초 제한)
          livenessProbe:
            exec: { command: ["node", "healthcheck.mjs", "db"] }
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 5
          {{- else if eq $name "web" }}
          readinessProbe:
            httpGet: { path: /nginx-health, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /nginx-health, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
          {{- end }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          resources:
            {{- toYaml $a.resources | nindent 12 }}
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
            {{- if eq $name "web" }}
            # nginx 이미지가 시작 때 템플릿을 채워 여기에 default.conf 를 쓴다 (docker-compose.prod.yml 의 tmpfs 와 같다)
            - { name: nginx-conf, mountPath: /etc/nginx/conf.d }
            {{- end }}
            {{- if and (eq $name "worker") $gcp.project }}
            - { name: gcp-token, mountPath: /var/run/secrets/tokens/gcp, readOnly: true }
            - { name: gcp-cred, mountPath: /var/run/gcp-cred, readOnly: true }
            {{- end }}
            {{- if $tfDisk }}
            - { name: tf-work, mountPath: /var/lib/svc-tf }
            {{- end }}
      volumes:
        - name: tmp
          emptyDir: {}
        {{- if $tfDisk }}
        - name: tf-work
          persistentVolumeClaim: { claimName: worker-tf-work }
        {{- end }}
        {{- if eq $name "web" }}
        - name: nginx-conf
          emptyDir: {}
        {{- end }}
        {{- if and (eq $name "worker") $gcp.project }}
        # 구글용 토큰 (1시간, 자동 갱신). 저장되는 키는 없다
        - name: gcp-token
          projected:
            sources:
              - serviceAccountToken:
                  audience: {{ $gcp.wifAudience }}
                  expirationSeconds: 3600
                  path: token
        - name: gcp-cred
          configMap:
            name: worker-gcp-cred
        {{- end }}
{{- if $a.service }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    app.kubernetes.io/name: {{ $name }}
    app.kubernetes.io/part-of: platform
spec:
  selector:
    app.kubernetes.io/name: {{ $name }}
  ports:
    - { name: http, port: {{ $a.port }}, targetPort: http }
{{- end }}
{{- end }}
{{- end }}
{{- end }}
