{{- /* External Secrets: 컨트롤러가 자기 Pod Identity(aws_iam_role.eso)로 읽는다. 그래서 auth 칸이 없다 */}}
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: aws-secrets-manager
spec:
  provider:
    aws:
      service: SecretsManager
      region: {{ .Values.aws.region }}
{{- /* 컴포넌트마다 Secret 하나 (<이름>-env). platform/app JSON 에서 secretKeys 에 적은 키만 꺼낸다 → 워커는 JWT 서명 키를 못 본다 */}}
{{- /* AI 점검의 GitOps 읽기 (values agentRemediation.gitopsRead): agent-worker 에 레포 주소와 읽기 토큰만 더한다. 쓰기 토큰은 안 준다 */}}
{{- $remediation := default dict .Values.agentRemediation }}
{{- range $name, $c := .Values.components }}
{{- $keys := $c.secretKeys }}
{{- if and (eq $name "agent-worker") $remediation.gitopsRead }}
{{- $keys = concat (default list $keys) (list "GITOPS_REPO_URL" "GITOPS_READ_TOKEN") | uniq }}
{{- end }}
{{- with $keys }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $name }}-env
spec:
  refreshInterval: 1h
  secretStoreRef: { name: aws-secrets-manager, kind: SecretStore }
  target: { name: {{ $name }}-env }
  data:
    {{- range . }}
    - secretKey: {{ . }}
      remoteRef: { key: {{ $.Values.secrets.app | quote }}, property: {{ . }} }
    {{- end }}
{{- end }}
{{- end }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cloudflared-token
spec:
  refreshInterval: 1h
  secretStoreRef: { name: aws-secrets-manager, kind: SecretStore }
  target: { name: cloudflared-token }
  data:
    - secretKey: TUNNEL_TOKEN
      remoteRef: { key: {{ .Values.secrets.cloudflared | quote }}, property: TUNNEL_TOKEN }
