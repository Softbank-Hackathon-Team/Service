{{- $g := .Values.sandbox.gvisor }}
{{- if and .Values.sandbox.enabled $g.enabled }}
{{- /* gVisor. 수정 고리 샌드박스만 쓴다 (sandbox-vap.yaml sbx-runtimeclass-guard). runsc 가 깔린 sandbox 노드에만 뜬다 */}}
apiVersion: node.k8s.io/v1
kind: RuntimeClass
metadata:
  name: {{ $g.runtimeClass }}
  labels:
    app.kubernetes.io/part-of: platform
handler: {{ $g.handler }}
scheduling:
  nodeSelector:
    pool: {{ .Values.sandbox.pool }}
  tolerations:
    - { key: dedicated, operator: Equal, value: {{ .Values.sandbox.pool }}, effect: NoSchedule }
{{- end }}
