# 플랫폼(제어판) 비밀 연동 + 바깥 입구. 이름은 infra/modules/aws/platform 과 맞물린다 (비밀 platform/*, ESO 역할)
aws:
  region: ap-northeast-2

# Secrets Manager 이름 (terraform output platform_secret_names). 값은 사람이 넣는다
secrets:
  app: platform/app                  # JSON. 각 컴포넌트는 secretKeys 에 적은 키만 받는다 (적은 키가 JSON 에 없으면 ESO 동기화가 멈춘다)
  cloudflared: platform/cloudflared  # JSON {"TUNNEL_TOKEN": "..."}

# 컴포넌트마다 받을 키 → 클러스터 Secret <이름>-env (앱 배포는 envFrom 으로 이 Secret 을 쓴다)
# 최소 권한: 워커는 JWT 서명 키를 못 본다
# 키를 더하면 helm upgrade 전에 platform/app JSON 에 그 키를 먼저 넣는다 (순서가 바뀌면 그 컴포넌트의 동기화가 멈춘다)
components:
  api:
    # AGENT_REPORT_MASTER_KEY: 온프레 Agent 등록·보고 서명 (32자 이상 무작위, 없으면 /agent/* 가 503 AGENT_REPORTS_DISABLED)
    # PUBLIC_API_URL: Agent 등록 응답에 담는 보고 주소 = 플랫폼 공개 주소 (비우면 요청 주소)
    secretKeys: [DATABASE_URL, JWT_SECRET, PLATFORM_PRINCIPAL_ARN, AGENT_REPORT_MASTER_KEY, PUBLIC_API_URL]
  worker:
    # GITOPS_*: 배포 단계가 gitops 레포에 커밋·push (없으면 모든 배포가 GITOPS_NOT_CONFIGURED 로 멈춘다, 클라우드·온프레 공통)
    #   GITOPS_REPO_URL·GITOPS_PUSH 는 비밀이 아니지만 차트에 비밀 아닌 값을 넘기는 길이 아직 없어 같은 JSON 으로 받는다 (아래 README TODO)
    secretKeys: [DATABASE_URL, GITOPS_REPO_URL, GITOPS_WRITE_TOKEN, GITOPS_PUSH]
  agent-worker:
    secretKeys: [DATABASE_URL, ANTHROPIC_API_KEY]
  otel-gateway:
    secretKeys: [DATABASE_URL]

# 바깥 입구: Cloudflare Tunnel (원격 관리 터널). 공개 호스트 이름과 http://web.<네임스페이스>.svc.cluster.local:8080 연결은 Cloudflare 쪽에서 한다
cloudflared:
  # DRAFT(ai): 버전 고정. 2026-11 기준 최신 안정판
  image: cloudflare/cloudflared:2026.10.7
  replicas: 2
  pool: general

# OTel 게이트웨이: 고객 수집기의 지표를 지표 토큰으로 확인해 Prometheus 로 넘긴다
otelGateway:
  image: ""   # api 이미지. 배포 파이프라인이 준다 (--set otelGateway.image=<레지스트리>/api:<태그>). 비어 있으면 안 만든다
  # DRAFT(ai): 버전 고정. filter·transform·prometheus 내보내기가 필요해서 contrib 판
  collectorImage: otel/opentelemetry-collector-contrib:0.164.0
  pool: general

# 플랫폼 앱 4개 (templates/app.yaml). 이미지 = <registry>/svc-<이름>:<tag> (ECR 이름은 infra/modules/aws/platform/main.tf local.images)
# registry·tag 둘 중 하나라도 비어 있으면 앱을 하나도 안 만든다 (값 없이 치는 기존 helm upgrade 가 그대로 돈다)
# envFrom 은 components.<이름> 이 있을 때만 <이름>-env (web 은 비밀이 없다)
apps:
  image:
    registry: ""   # 예: 725072160743.dkr.ecr.ap-northeast-2.amazonaws.com
    tag: ""        # 예: 0.0.1-test2
  api:
    enabled: true
    # DRAFT(ai): 2개. web·cloudflared 뒤에서 하나가 죽어도 화면이 안 끊기게
    replicas: 2
    port: 3000          # 이미지 API_PORT 기본. web 이미지 API_UPSTREAM 기본 http://api:3000 과 맞물린다
    metricsPort: 9464   # METRICS_PORT 기본. Prometheus 는 이름이 metrics 인 포트만 긁는다
    pool: general
    serviceAccount: api            # Pod Identity platform/api
    automountServiceAccountToken: false
    service: true
    # DRAFT(ai): 크기 전부 임시. general t3.medium ×2 에 cloudflared·otel·관측 스택과 같이 올라간다
    resources:
      requests: { cpu: 100m, memory: 192Mi }
      limits: { memory: 384Mi }
  worker:
    enabled: true
    # DRAFT(ai): 2개. main.tf cred_nodes 주석 "워커 ×2". 작업은 pg-boss 가 나눠 준다
    replicas: 2
    metricsPort: 9465   # WORKER_METRICS_PORT 기본. 살아 있음 검사도 이 포트 /metrics
    # 고객 자격을 쥔 파드만 cred 노드에 (main.tf cred_nodes 주석). taint dedicated=cred:NoSchedule 를 견딘다
    pool: cred
    serviceAccount: worker         # Pod Identity platform/worker + argocd Role
    automountServiceAccountToken: true   # Argo CD Application 읽기·patch (worker-argocd-rbac.yaml)
    service: false
    # 쥔 작업을 pg-boss stop 30초(강제 기한 35초)까지 기다린다 (docker-compose.prod.yml stop_grace_period 40s 와 같다)
    terminationGracePeriodSeconds: 40
    resources:
      requests: { cpu: 100m, memory: 256Mi }
      limits: { memory: 512Mi }
  agent-worker:
    enabled: true
    replicas: 1
    pool: general                  # main.tf general_nodes 주석 "AI 워커". cred 노드에 안 간다 (고객 자격 0)
    serviceAccount: agent-worker   # Pod Identity 없음. 샌드박스 호스트 권한만 (agent-worker-rbac.yaml)
    automountServiceAccountToken: true   # sbx-* 네임스페이스·vCluster 를 helm·kubectl 로 다룬다
    service: false
    resources:
      requests: { cpu: 100m, memory: 256Mi }
      limits: { memory: 512Mi }
  web:
    enabled: true
    replicas: 2
    port: 8080          # cloudflared console.<도메인> → http://web.<네임스페이스>.svc.cluster.local:8080
    pool: general
    serviceAccount: ""  # 클러스터 API·클라우드 권한 없음 → 네임스페이스 default, 토큰 안 붙임
    automountServiceAccountToken: false
    service: true
    resources:
      requests: { cpu: 20m, memory: 32Mi }
      limits: { memory: 128Mi }

# 워커가 Application 을 읽고 새로고침 표시를 다는 Argo CD 네임스페이스 (Role·RoleBinding 이 여기 생긴다)
argocd:
  namespace: argocd

# 샌드박스(vCluster 리허설·수정 고리) 호스트 쪽 권한과 가드. agent-worker 가 sbx-* 네임스페이스에 vCluster 를 하나씩 만들고 지운다
# 끄면 agent-worker 권한·VAP·StorageClass·RuntimeClass 가 모두 빠진다 (서비스 계정은 남는다)
sandbox:
  # DRAFT(ai): 기본 끔. 켜면 imageRegistry 가 꼭 있어야 해서, 값 없이 치는 기존 설치 명령이 그대로 돌게 한다.
  #   켜면 권한은 agent-worker 서비스 계정 하나에만 묶이고 VAP 는 sbx 라벨 네임스페이스에만 걸린다
  enabled: false
  # 노드 그룹 라벨 pool 과 taint dedicated=<pool>:NoSchedule (infra/modules/aws/platform/main.tf aws_eks_node_group.this)
  pool: sandbox
  # 리허설 이미지 복사 자리 <계정>.dkr.ecr.<리전>.amazonaws.com/<접두어> (worker SANDBOX_IMAGE_REGISTRY 와 같은 값). sandbox.enabled 면 꼭 넣는다.
  # sbx-pod-guard 가 이 계정의 ECR 이미지는 <이 값>/<네임스페이스 platform.svc/tenant>/ 아래만 받는다 (sandbox 노드 역할은 계정 ECR 전체를 읽는다)
  imageRegistry: ""
  # 리허설 치환이 PVC storageClassName 을 이 이름으로 바꾼다
  storageClass:
    name: sbx-standard
    # DRAFT(ai): EBS CSI. 플랫폼 Terraform 에 aws-ebs-csi-driver addon 이 아직 없다 → TODO(human) README 참고
    provisioner: ebs.csi.aws.com
    parameters:
      type: gp3
  # gVisor. 켜면 리허설과 수정 고리 샌드박스 파드가 모두 이 RuntimeClass 로만 뜬다 (sbx-runtimeclass-guard). 리허설은 전용 노드 + 한 번에 한 테넌트
  #   켤 때 세 곳을 같이: Terraform sandbox_gvisor_enabled(노드에 runsc), 이 값, agent-worker SANDBOX_RUNTIME_CLASS=gvisor
  gvisor:
    # DRAFT(ai): 기본 끔. 끄면 리허설은 노드 기본 런타임(runc)으로 돌고, 수정 고리 샌드박스 워크로드는 뜨지 못한다 (닫힌 쪽)
    enabled: false
    runtimeClass: gvisor
    handler: runsc
