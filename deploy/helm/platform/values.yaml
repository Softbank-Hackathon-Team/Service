# 플랫폼(제어판) 비밀 연동 + 바깥 입구. 이름은 infra/modules/aws/platform 과 맞물린다 (비밀 platform/*, ESO 역할)
aws:
  region: ap-northeast-2

# Secrets Manager 이름 (terraform output platform_secret_names). 값은 사람이 넣는다
secrets:
  app: platform/app                  # JSON. 각 컴포넌트는 secretKeys 에 적은 키만 받는다 (적은 키가 JSON 에 없으면 ESO 동기화가 멈춘다)
  cloudflared: platform/cloudflared  # JSON {"TUNNEL_TOKEN": "..."}

# 컴포넌트마다 받을 키 → 클러스터 Secret <이름>-env (앱 배포는 envFrom 으로 이 Secret 을 쓴다)
# 최소 권한: 워커는 JWT 서명 키를 못 본다
# 키를 더하면 helm upgrade 전에 platform/app JSON 에 그 키를 먼저 넣는다 (순서가 바뀌면 그 컴포넌트의 동기화가 멈춘다)
components:
  api:
    # AGENT_REPORT_MASTER_KEY: 온프레 Agent 등록·보고 서명 (32자 이상 무작위, 없으면 /agent/* 가 503 AGENT_REPORTS_DISABLED)
    # PUBLIC_API_URL: Agent 등록 응답에 담는 보고 주소 = 플랫폼 공개 주소 (비우면 요청 주소)
    # CONNECT_TEMPLATE_URL: 콘솔 "AWS 연결" 링크의 CloudFormation 템플릿 주소 (Terraform 출력 connect_template_url, 없으면 연결 링크가 503 CONNECT_NOT_CONFIGURED)
    secretKeys: [DATABASE_URL, JWT_SECRET, PLATFORM_PRINCIPAL_ARN, AGENT_REPORT_MASTER_KEY, PUBLIC_API_URL, CONNECT_TEMPLATE_URL]
  worker:
    # GITOPS_*: 배포 단계가 gitops 레포에 커밋·push (없으면 모든 배포가 GITOPS_NOT_CONFIGURED 로 멈춘다, 클라우드·온프레 공통)
    #   GITOPS_REPO_URL·GITOPS_PUSH 는 비밀이 아니지만 apps.worker.env 가 생기기 전부터 같은 JSON 으로 받았다. 옮길지는 README "아직 없는 것" TODO
    # REPL_SECRET_MASTER_KEY: 이전별 비밀(온프레 이전 전용 계정 비밀번호·터널/중계 SSH 키·CA 씨앗)을 파생하는 마스터 키 (ADR-019, 32자 이상).
    #   바꾸면 진행 중인 이전의 파생 값이 모두 달라진다 → 이전이 없을 때만 교체
    # PLATFORM_EGRESS_CIDRS: worker 가 밖으로 나가는 IP(NAT) 대역. 자동 중계의 5432 를 이 대역에만 연다 (비밀은 아니지만 위와 같은 까닭으로 같은 JSON)
    secretKeys: [DATABASE_URL, GITOPS_REPO_URL, GITOPS_WRITE_TOKEN, GITOPS_PUSH, REPL_SECRET_MASTER_KEY, PLATFORM_EGRESS_CIDRS]
  agent-worker:
    secretKeys: [DATABASE_URL, ANTHROPIC_API_KEY]
  otel-gateway:
    secretKeys: [DATABASE_URL]

# 바깥 입구: Cloudflare Tunnel (원격 관리 터널). 공개 호스트 이름과 http://web.<네임스페이스>.svc.cluster.local:8080 연결은 Cloudflare 쪽에서 한다
cloudflared:
  # DRAFT(ai): 버전 고정. 2026-11 기준 최신 안정판
  image: cloudflare/cloudflared:2026.10.7
  replicas: 2
  pool: general

# OTel 게이트웨이: 고객 수집기의 지표를 지표 토큰으로 확인해 Prometheus 로 넘긴다
otelGateway:
  image: ""   # api 이미지. 배포 파이프라인이 준다 (--set otelGateway.image=<레지스트리>/api:<태그>). 비어 있으면 안 만든다
  # DRAFT(ai): 버전 고정. filter·transform·prometheus 내보내기가 필요해서 contrib 판
  collectorImage: otel/opentelemetry-collector-contrib:0.164.0
  pool: general

# 플랫폼 앱 4개 (templates/app.yaml). 이미지 = <registry>/svc-<이름>:<tag> (ECR 이름은 infra/modules/aws/platform/main.tf local.images)
# registry·tag 둘 중 하나라도 비어 있으면 앱을 하나도 안 만든다 (값 없이 치는 기존 helm upgrade 가 그대로 돈다)
# envFrom 은 components.<이름> 이 있을 때만 <이름>-env (web 은 비밀이 없다)
# env: 비밀 아닌 설정 (이름: 값). 그 앱 env 맨 뒤에 붙는다. 예 --set apps.worker.env.STEP_CONCURRENCY=5
#   차트가 넣는 이름(HOME·PROM_URL·MOCK_TRAFFIC 등), 그 앱 secretKeys 에 있는 이름, 비밀처럼 보이는 이름(*_TOKEN·*_SECRET·*_PASSWORD·*_KEY·*DATABASE_URL)은 렌더가 멈춘다
apps:
  image:
    registry: ""   # 예: 725072160743.dkr.ecr.ap-northeast-2.amazonaws.com
    tag: ""        # 예: 0.0.1-test2
  api:
    enabled: true
    # DRAFT(ai): 2개. web·cloudflared 뒤에서 하나가 죽어도 화면이 안 끊기게
    replicas: 2
    port: 3000          # 이미지 API_PORT 기본. web 이미지 API_UPSTREAM 기본 http://api:3000 과 맞물린다
    metricsPort: 9464   # METRICS_PORT 기본. Prometheus 는 이름이 metrics 인 포트만 긁는다
    pool: general
    serviceAccount: api            # Pod Identity platform/api
    automountServiceAccountToken: false
    service: true
    env: {}
    # DRAFT(ai): 크기 전부 임시. general t3.medium ×2 에 cloudflared·otel·관측 스택과 같이 올라간다
    resources:
      requests: { cpu: 100m, memory: 192Mi }
      limits: { memory: 384Mi }
  worker:
    enabled: true
    # DRAFT(ai): 2개. main.tf cred_nodes 주석 "워커 ×2". 작업은 pg-boss 가 나눠 준다
    replicas: 2
    metricsPort: 9465   # WORKER_METRICS_PORT 기본. 살아 있음 검사도 이 포트 /metrics
    # 고객 자격을 쥔 파드만 cred 노드에 (main.tf cred_nodes 주석). taint dedicated=cred:NoSchedule 를 견딘다
    pool: cred
    serviceAccount: worker         # Pod Identity platform/worker + argocd Role
    automountServiceAccountToken: true   # Argo CD Application 읽기·patch (worker-argocd-rbac.yaml)
    service: false
    # 쥔 작업을 pg-boss stop 30초(강제 기한 35초)까지 기다린다 (docker-compose.prod.yml stop_grace_period 40s 와 같다)
    terminationGracePeriodSeconds: 40
    # Terraform 작업 폴더 디스크. 파드가 지워져도 state·입력값·출력값이 남게 한다. 비우면 예전처럼 /tmp
    # 켜려면 플랫폼 Terraform 의 aws-ebs-csi-driver 애드온이 먼저 있어야 하고 replicas 는 1 이어야 한다 (README)
    tfWorkDir:
      size: ""   # DRAFT(ai): 예 20Gi. 이전마다 프로바이더 파일을 받아 수백 MB~1GB 를 쓴다
    env: {}
    # DRAFT(ai): 이전 여러 건이 동시에 돌아도 노드가 worker 몫을 비워 두게 requests 를 올렸다 (pg-boss 단계 큐가 워커당 4건, STEP_CONCURRENCY).
    #   cred 노드 t3.medium 1대(CPU 할당 가능 약 1930m)에 Argo CD 허브와 같이 뜬다. 롤링 업데이트 때 파드가 하나 더 뜨는 것까지 README "앱 배포" 계산 참고
    resources:
      requests: { cpu: 500m, memory: 512Mi }
      # DRAFT(ai): terraform plan·apply 를 같은 파드에서 돌려 512Mi 에서 올렸다. 실측 전 값
      limits: { memory: 2Gi }
  agent-worker:
    enabled: true
    # DRAFT(ai): 1 로 둔다. 리허설 동시 실행 상한과 노드 고르기 잠금이 프로세스 하나 기준이다 (vcluster.ts serialize).
    #   동시 실행은 env.SANDBOX_REHEARSAL_CONCURRENCY (sandbox 노드 수 이하, 2 이상이면 회사마다 다른 노드에 고정)
    replicas: 1
    pool: general                  # main.tf general_nodes 주석 "AI 워커". cred 노드에 안 간다 (고객 자격 0)
    serviceAccount: agent-worker   # Pod Identity 없음. 샌드박스 호스트 권한만 (agent-worker-rbac.yaml)
    automountServiceAccountToken: true   # sbx-* 네임스페이스·vCluster 를 helm·kubectl 로 다룬다
    service: false
    env: {}
    resources:
      requests: { cpu: 100m, memory: 256Mi }
      limits: { memory: 512Mi }
  web:
    enabled: true
    replicas: 2
    port: 8080          # cloudflared console.<도메인> → http://web.<네임스페이스>.svc.cluster.local:8080
    pool: general
    serviceAccount: ""  # 클러스터 API·클라우드 권한 없음 → 네임스페이스 default, 토큰 안 붙임
    automountServiceAccountToken: false
    service: true
    env: {}
    resources:
      requests: { cpu: 20m, memory: 32Mi }
      limits: { memory: 128Mi }

# 플랫폼 GCP 프로젝트. 비우면 아무것도 안 만든다 (값 없이 치는 기존 helm upgrade 가 그대로 돈다)
# 채우면 api·worker 에 GCP_PLATFORM_PROJECT 를 주고, worker 는 키 없이 svc-worker@<project> 로 gcloud 를 시작한다 (templates/worker-gcp.yaml)
gcpPlatform:
  project: ""       # 플랫폼 프로젝트 ID
  wifAudience: ""   # infra/modules/gcp/platform-wif 출력 audience. project 를 채우면 꼭 넣는다

# 트래픽 판정 지표 (#245). 비우면 아무것도 안 만든다
trafficMetrics:
  endpoint: ""      # 도착 수집기가 보낼 주소 (https://metrics.<도메인>/v1/metrics). 채우면 AWS·GCP 도착 cloudflared 에 수집기가 붙는다
  promUrl: ""       # 판정이 읽는 Prometheus. 도착 지표가 들어온 뒤에 켠다. 먼저 켜면 표본 부족으로 롤백된다

# 도착 입구 터널 토큰 출처 (플랫폼 AWS 계정 Secrets Manager, aws.region). 둘 다 있으면 worker 에 TARGET_TUNNEL_SECRET_ID·_KEY 를 넣고,
#   배포 단계가 GCP 도착의 빈 cloudflared-token 그릇을 이 값으로 채운다 (AWS 도착은 안 채움) (이미 값이 든 그릇은 안 덮는다). 비우면 예전처럼 SECRET_VALUES_MISSING 으로 멈춘다
#   worker 역할에 이 비밀 읽기 권한이 있어야 한다 (infra/modules/aws/platform/pod-identity.tf ReadTargetTunnelToken)
#   기본은 비워 둔다 (끔). aws/platform apply 로 worker 읽기 권한이 생긴 뒤, shop 시험 때만 켠다:
#   --set targetTunnel.secretId=platform/shop-tunnels --set targetTunnel.secretKey=targetToken
#   apply 전에 켜면 worker 가 비밀을 못 읽어 GCP 도착이 SECRET_VALUES_UNKNOWN 으로 멈추고, 켜 둔 채면 입구 있는 GCP 도착 모두가 같은 터널 토큰을 받는다
# DRAFT(ai): 기본 빈 값 (리뷰 반영). TODO(human) 온프레 VM 도착과 같은 토큰이라 도착별로 키를 나눌지, 앱이 여럿이면 비밀 id 를 어떻게 고를지
targetTunnel:
  secretId: ""
  secretKey: ""

# 흉내 트래픽: worker 에 MOCK_TRAFFIC=1. 진짜 지표(trafficMetrics.promUrl)·LB 전환기가 없는 실측에서 shifting 을 가짜 지표·mock 전환기로 넘긴다.
#   기본 끔 → 진짜 판은 설정이 없으면 shifting 이 TRAFFIC_NOT_CONFIGURED 로 멈춘다. DEMO_MODE=1 이면 worker 가 뜨지 않는다 (contracts config 가드)
traffic:
  mock: false

# GCP 도착에 GKE 가 없으면 worker 가 환경 층(VPC·GKE·AR·ESO)을 고객 svc-env 로 만든다: worker 에 ENV_LAYER_AUTO=1.
#   기본 끔. 켠 뒤에 만든 계획부터 환경 층이 들어간다 (켜기 전에 승인한 계획은 apply 가 TF_PLAN_DRIFT 로 멈춘다)
envLayer:
  auto: false

# 배포 단계가 GCP 도착의 빈 svc-metric-token 그릇에 지표 토큰을 새로 발급해 채운다: worker 에 METRIC_TOKEN_AUTOFILL=1.
#   기본 끔 → 빈 지표 그릇은 예전처럼 SECRET_VALUES_MISSING 으로 멈춘다 (사람이 값을 넣고 재개). 터널 토큰 채우기(targetTunnel)와는 따로 켠다
#   기본 끔인 이유: 환경당 살아 있는 지표 토큰은 하나라, 발급하면 그 환경의 기존 토큰이 끊긴다. 같은 도착 환경에 앱이 둘이면 첫 앱 지표가 끊긴다
# DRAFT(ai): 기본 끔 (리뷰 반영)
ingressSecretFill:
  metricToken: false

# 워커가 Application 을 읽고 새로고침 표시를 다는 Argo CD 네임스페이스 (Role·RoleBinding 이 여기 생긴다)
argocd:
  namespace: argocd
  # 허브의 AWS 역할 = Terraform(infra/modules/aws/platform) 출력 argocd_hub_role_arn. 비우면 아무것도 안 바뀐다 (EKS 도착 목적지는 사람이 등록)
  # 채우면 api·worker 에 ARGO_HUB_ROLE_ARN: 연결 링크가 고객 템플릿에 svc-deploy 를 만들고, 워커가 EKS 앱 구역 RoleBinding·Argo cluster Secret 을 쓴다
  hubRoleArn: ""

# 샌드박스(vCluster 리허설·수정 고리) 호스트 쪽 권한과 가드. agent-worker 가 sbx-* 네임스페이스에 vCluster 를 하나씩 만들고 지운다
# 끄면 agent-worker 권한·VAP·StorageClass·RuntimeClass 가 모두 빠진다 (서비스 계정은 남는다)
sandbox:
  # DRAFT(ai): 기본 끔. 켜면 imageRegistry 가 꼭 있어야 해서, 값 없이 치는 기존 설치 명령이 그대로 돌게 한다.
  #   켜면 권한은 agent-worker 서비스 계정 하나에만 묶이고 VAP 는 sbx 라벨 네임스페이스에만 걸린다
  enabled: false
  # 노드 그룹 라벨 pool 과 taint dedicated=<pool>:NoSchedule (infra/modules/aws/platform/main.tf aws_eks_node_group.this)
  pool: sandbox
  # 리허설 이미지 복사 자리 <계정>.dkr.ecr.<리전>.amazonaws.com/<접두어>. sandbox.enabled 면 꼭 넣는다. rehearsal 을 켜면 차트가 worker SANDBOX_IMAGE_REGISTRY 로 넘긴다.
  # sbx-pod-guard 가 이 계정의 ECR 이미지는 <이 값>/<네임스페이스 platform.svc/tenant>/ 아래만 받는다 (sandbox 노드 역할은 계정 ECR 전체를 읽는다)
  imageRegistry: ""
  # 리허설(배포 커밋 직전 vCluster 시험). 켜면 차트가 worker 에 SANDBOX_REHEARSAL=on 과 SANDBOX_IMAGE_REGISTRY=<imageRegistry> 를 넣는다 (templates/app.yaml).
  #   sandbox.enabled 가 꺼져 있으면 렌더가 멈춘다 (리허설은 sandbox 노드·호스트 가드·agent-worker 권한이 있어야 돈다)
  rehearsal:
    # DRAFT(ai): 기본 끔. 끄면 리허설은 건너뜀(disabled)으로 지나간다
    enabled: false
  # 리허설 치환이 PVC storageClassName 을 이 이름으로 바꾼다
  storageClass:
    name: sbx-standard
    # DRAFT(ai): EBS CSI. 플랫폼 Terraform 에 aws-ebs-csi-driver addon 이 아직 없다 → TODO(human) README 참고
    provisioner: ebs.csi.aws.com
    parameters:
      type: gp3
  # gVisor. 켜면 리허설과 수정 고리 샌드박스 파드가 모두 이 RuntimeClass 로만 뜬다 (sbx-runtimeclass-guard). 리허설은 전용 노드 + 한 번에 한 테넌트
  #   켤 때 두 곳을 같이: Terraform sandbox_gvisor_enabled(노드에 runsc), 이 값. agent-worker SANDBOX_RUNTIME_CLASS 는 차트가 runtimeClass 로 넣는다
  gvisor:
    # DRAFT(ai): 기본 끔. 끄면 리허설은 노드 기본 런타임(runc)으로 돌고, 수정 고리 샌드박스 워크로드는 뜨지 못한다 (닫힌 쪽)
    enabled: false
    runtimeClass: gvisor
    handler: runsc

# AI 점검(agent-worker 수정 고리, agent-run)이 GitOps 레포 deploy/ 를 읽는 길. 끄면 진짜 LLM 점검이 GITOPS_NOT_CONFIGURED 로 끝난다
agentRemediation:
  # DRAFT(ai): 기본 끔. 켜면 agent-worker 가 platform/app 의 GITOPS_REPO_URL·GITOPS_READ_TOKEN 을 받는다 (JSON 에 GITOPS_READ_TOKEN 을 먼저 넣는다)
  #   GITOPS_WRITE_TOKEN 은 주지 않는다: agent-worker 는 고객 로그를 LLM 에 넣는 곳이고, gitops 레포 main 에는 보호 규칙이 없다
  #   (쓰기 토큰이 새면 main push = 고객 클러스터 배포). 수정안은 원격에 push 하지 않고 패치로 남는다 (GITOPS_PUSH 없음)
  gitopsRead: false
  # DRAFT(ai): AI 점검이 쓸 샌드박스 (agent-worker env SANDBOX_MODE). 비우면 agent-worker 기본 = memory(가짜 클러스터)
  #   memory | vcluster 만 받는다 (k3d 는 맥 로컬용). vcluster 는 sandbox.enabled·sandbox.gvisor.enabled 와 같이 켜야 렌더된다:
  #   수정 실행 파드는 sbx-runtimeclass-guard 가 gVisor 만 받아서, gVisor 가 꺼져 있으면 파드가 전부 거부된다
  #   TODO(human): vcluster 로 켜기 전에, LLM 도구가 vCluster 안에서 관리자 클라이언트로 도는 것(조회 전용 kubeconfig 로 바꾸는 일)을 정한다
  sandboxMode: ""
