# 고객 온프레 설치 묶음 (ADR-005 D2·D3, 설계 문서 W2). 설치는 tools/onprem-install.sh 가 한다
#   전제: Argo CD core(tools/argocd-core-install-v2.13.3.yaml)가 argocd 네임스페이스에 이미 있다 (설치 스크립트가 sha 확인 뒤 깐다)
#   비밀값은 이 파일에 넣지 않는다. Agent 키·git 읽기 자격은 설치 스크립트가 Secret 으로 먼저 만든다 (helm 기록에 비밀이 남지 않게)

# 회사 폴더 이름 (gitops 저장소 tenants/<tenant>/..., 워커 tenantSlug = "t-" + 회사 uuid 앞 8글자). 필수
tenant: ""

# 이 온프레 환경 구분 = 콘솔 환경 uuid 앞 16진수 8글자 (워커 siteOf). gitops 폴더 tenants/<tenant>/apps/<앱>/onprem-k3s-<site> 만 당긴다.
#   비우면 예전처럼 회사 공용 폴더 onprem-k3s 를 본다 (한 회사의 온프레 환경이 둘 이상이면 모두 같은 앱을 받는다: 다시 설치해서 채운다)
site: ""

gitops:
  # gitops 저장소 주소. 필수. 회사 경로만 읽는 읽기 전용 자격은 Argo 저장소 Secret(설치 스크립트)이 가진다
  repoURL: ""
  revision: main
  # 묶음 폴더 안에서 Argo 가 적용할 하위 폴더 (워커가 manifests/*.yaml 로 렌더한다, apps/worker/src/gitops/repo.ts)
  manifestsDir: manifests
  # site 를 채운 뒤에도 예전 공용 폴더(onprem-k3s)를 같이 볼지. 예전 폴더로 진행 중인 이전이 있는 클러스터를 다시 설치할 때만 켠다
  #   (끄면 ApplicationSet 이 그 Application 을 지우고 앱·DB 도 같이 지운다). 설치 스크립트가 클러스터에 예전 Application 이 있으면 켠다
  legacyPath: false

argocd:
  namespace: argocd
  # DRAFT(ai): 새 앱 폴더 찾는 주기(초). Argo 기본 180. git 확인 주기(설치 스크립트 ARGO_POLL)와 같은 30 으로 둔다
  discoverSeconds: 30

agent:
  # 이미지. digest 고정 필수 (repo@sha256:...). 태그만 주면 렌더가 실패한다
  image: ""
  # 서명 보고를 받을 플랫폼 API 주소 (밖으로 443). 필수
  reportURL: ""
  # AGENT_KEY_ID · AGENT_KEY_SECRET 이 든 Secret 이름 (onprem-agent --enroll 결과로 설치 스크립트가 만든다)
  keySecret: agent-key
  # heartbeat 주기(초). security 는 10번에 1번
  every: 30
  # DRAFT(ai): Agent 한 개가 보는 앱 네임스페이스. 지금 실행기는 하나만 읽는다(AGENT_NAMESPACE)
  appNamespace: ""
  cnpgCluster: app-db
  resources:
    requests: { cpu: 10m, memory: 64Mi }
    limits: { memory: 192Mi }

# 권한 단계 (ADR-005 D3). L0 은 늘 켜짐. L1 은 고객이 고르는 선택지
grants:
  # L1: 클러스터 범위 읽기 허용 목록 (노드, 바인딩, Kyverno 정책 등). 기본 끔
  cluster: false
  # 온프레 출발 가져오기: Agent 가 인벤토리 스냅숏(ConfigMap 값 포함, Secret 제외)을 읽어 보낸다 (rbac.yaml 의 svc-onprem-agent-inventory)
  # DRAFT(ai): 기본 켬. 끄면 Agent 도 inventory 를 안 보내고(AGENT_INVENTORY=0), 이 환경을 출발로 가져오기는 "스냅숏 없음"으로 멈춘다
  inventory: true

# 트래픽 판정 지표 수집기 (#245). 도착 앱 cloudflared 의 상태 코드별 응답 수를 긁어 플랫폼 지표 주소로 보낸다.
#   endpoint 를 비우면 안 만든다. 토큰은 이 회사 환경의 지표 토큰 하나 (콘솔·API POST /api/v1/environments/:id/metric-token).
#   값은 이 파일·helm 기록에 넣지 않는다: 설치 스크립트가 METRIC_TOKEN_FILE 로 Secret 을 먼저 만든다
metrics:
  # 예: https://metrics.<도메인>/v1/metrics (Cloudflare 터널 → 플랫폼 otel-gateway)
  endpoint: ""
  # 키 token 이 든 Secret 이름
  tokenSecret: svc-metric-token
  # DRAFT(ai): 플랫폼 otel-gateway 와 같은 판 (deploy/helm/platform values otelGateway.collectorImage). digest 고정 필수
  image: otel/opentelemetry-collector-contrib:0.164.0@sha256:340c9ca6a36617084c6661bdc4f0fe92b7cda5a805d61673ec8db375fddc522b
  # DRAFT(ai): 긁는 주기(초). 판정 창 30초 안에 표본이 여러 번 들어오게 5
  scrapeSeconds: 5
  resources:
    requests: { cpu: 20m, memory: 64Mi }
    limits: { memory: 192Mi }
