{{- include "oa.required" . }}
# 권한 단계 (ADR-005 D3). 쓰기 동사(create·update·patch·delete)는 어디에도 없다. Secret·ConfigMap 은 읽지 않는다
# DRAFT(ai): L0 을 클러스터 범위로 묶는다. 앱 네임스페이스(app-<앱>)는 설치 뒤 git 이 만들어서 설치 때 네임스페이스별 RoleBinding 을
#   미리 둘 수 없고, git 으로 RoleBinding 을 만들게 하면 AppProject 가 RBAC 를 열어야 한다(더 위험). 대신 종류를 좁힌다
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: svc-onprem-agent-l0
  labels: {{- include "oa.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["pods", "services", "endpoints", "persistentvolumeclaims", "events", "namespaces"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets", "replicasets", "daemonsets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["postgresql.cnpg.io"]
    resources: ["clusters"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["argoproj.io"]
    resources: ["applications"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["wgpolicyk8s.io"]
    resources: ["policyreports"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: svc-onprem-agent-l0
  labels: {{- include "oa.labels" . | nindent 4 }}
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: svc-onprem-agent-l0 }
subjects:
  - { kind: ServiceAccount, name: onprem-agent, namespace: {{ .Release.Namespace }} }
{{- if .Values.grants.cluster }}
---
# L1 (고객 선택): 클러스터 보안 사실(노드, 남은 cluster-admin 바인딩, Kyverno 정책)을 읽는다
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: svc-onprem-agent-l1
  labels: {{- include "oa.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list"]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["clusterrolebindings", "rolebindings"]
    verbs: ["get", "list"]
  - apiGroups: ["kyverno.io"]
    resources: ["clusterpolicies", "policies"]
    verbs: ["get", "list"]
  - apiGroups: ["wgpolicyk8s.io"]
    resources: ["clusterpolicyreports"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: svc-onprem-agent-l1
  labels: {{- include "oa.labels" . | nindent 4 }}
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: svc-onprem-agent-l1 }
subjects:
  - { kind: ServiceAccount, name: onprem-agent, namespace: {{ .Release.Namespace }} }
{{- end }}
