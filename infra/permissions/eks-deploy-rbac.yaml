# ID-1: Argo CD 허브(고객 역할 svc-deploy → access entry 그룹 platform:deploy)가 도착 클러스터에 앱을 쓰는 권한.
# 클러스터 전체 묶음(ClusterRoleBinding)은 없다. ClusterRole 은 정의만 하고, 앱 네임스페이스마다 RoleBinding 으로만 묶는다
#   → kube-system·고객 다른 네임스페이스에는 닿지 않는다. Argo CD 클러스터 등록은 namespaces 를 앱 네임스페이스로 한정해야 한다(클러스터 범위 목록 권한 없음)
# RoleBinding 은 실행 역할(platform:operate)이 네임스페이스를 만들 때 같이 만든다 (bind 권한은 eks-operate-namespace-rbac.yaml).
# 종류 = gitops/charts/app 템플릿이 그리는 것 (Deployment·StatefulSet·Service·ConfigMap·ServiceAccount·Ingress·PVC·Job·CronJob·HPA·ExternalSecret).
#   Secret 은 쓰지 않는다 (External Secrets 가 만든다). Role·RoleBinding·NetworkPolicy·ResourceQuota 는 Argo 울타리와 같게 뺀다
# DRAFT(ai): 목록은 차트 기준. 차트가 종류를 늘리면 여기도 늘린다. 고객이 부트스트랩 때 한 번 kubectl apply
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: platform-deploy-app
rules:
  - apiGroups: [""]
    resources: ["services", "configmaps", "serviceaccounts", "persistentvolumeclaims"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["pods", "events"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets", "replicasets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["batch"]
    resources: ["jobs", "cronjobs"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["autoscaling"]
    resources: ["horizontalpodautoscalers"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["external-secrets.io"]
    resources: ["externalsecrets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
