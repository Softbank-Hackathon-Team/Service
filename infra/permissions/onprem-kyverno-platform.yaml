# 온프레 k3s: RBAC만으로 못 막는 두 가지를 Kyverno 입장 정책으로 막는다. 부트스트랩 때 한 번 kubectl apply.
# (1) 플랫폼 네임스페이스(managed-by=platform)가 생기면 그 안에만 platform-operate-app RoleBinding을 만든다 (위협 모델 K-1)
#     → 실행 신원은 RBAC 권한이나 bind 동사 없이도 자기 앱 네임스페이스에서만 일한다
# (2) platform:operate 그룹은 managed-by=platform 표시가 없는 네임스페이스(kube-system 등)를 못 지운다 (K-2)
# DRAFT(ai): Kyverno 설치는 infra/onprem/bootstrap.sh 에 추가 필요 (차트 버전 고정 TODO(human))
# Z47: (0) Kyverno 가 (1)의 RoleBinding 을 만들 권한. Kyverno 1.10+ 는 generate 를 background controller 가 하고,
#     그 컨트롤러는 기본으로 rolebindings 를 못 만든다 → 정책 등록 때 거부되거나 RoleBinding 이 안 생긴다【추정, Kyverno 문서 "Generate rules · permissions"】.
#     집계(aggregate) 라벨로 컨트롤러 역할에 더한다. 정책보다 먼저 적용돼야 해서 파일 맨 앞에 둔다
# DRAFT(ai): k3d 에서 bootstrap.sh 로 확인 전. 이미 권한이 있으면 이 역할은 겹칠 뿐 해가 없다
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kyverno-generate-platform-operate-app
  labels:
    rbac.kyverno.io/aggregate-to-background-controller: "true"
    rbac.kyverno.io/aggregate-to-admission-controller: "true"
rules:
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["rolebindings"]
    verbs: ["create", "delete", "get", "list", "patch", "update", "watch"]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["clusterroles"]
    resourceNames: ["platform-operate-app"]
    verbs: ["bind"]
---
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: platform-namespace-rolebinding
spec:
  rules:
    - name: bind-operate-app-in-platform-namespaces
      match:
        any:
          - resources:
              kinds: ["Namespace"]
              selector:
                matchLabels: { managed-by: platform }
      generate:
        apiVersion: rbac.authorization.k8s.io/v1
        kind: RoleBinding
        name: platform-operate-app
        namespace: "{{request.object.metadata.name}}"
        synchronize: true
        data:
          roleRef:
            apiGroup: rbac.authorization.k8s.io
            kind: ClusterRole
            name: platform-operate-app
          subjects:
            - apiGroup: rbac.authorization.k8s.io
              kind: Group
              name: platform:operate
---
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: platform-namespace-delete-guard
spec:
  validationFailureAction: Enforce
  background: false
  rules:
    - name: only-platform-namespaces
      match:
        any:
          - resources:
              kinds: ["Namespace"]
              operations: ["DELETE"]
            subjects:
              - kind: Group
                name: platform:operate
      validate:
        message: "platform:operate는 managed-by=platform 네임스페이스만 지울 수 있다"
        deny:
          conditions:
            any:
              - key: "{{request.oldObject.metadata.labels.\"managed-by\" || ''}}"
                operator: NotEquals
                value: platform
---
# Z47: (3) 라벨 우회 막기. platform:operate 는 네임스페이스 patch 권한이 있어서, 막지 않으면
#     kube-system 에 managed-by=platform 을 붙여 (1) RoleBinding 을 생기게 하고 (2) 삭제 가드도 통과한다 → 클러스터 장악.
#     → platform:operate 는 원래 managed-by=platform 인 네임스페이스만 고칠 수 있고, 그 표시를 떼거나 바꿀 수 없다.
#       새로 만들 때도 표시를 달아야 한다 (infra/modules/onprem/app 은 이미 달고 만든다)
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: platform-namespace-label-guard
spec:
  validationFailureAction: Enforce
  background: false
  rules:
    - name: update-only-platform-namespaces
      match:
        any:
          - resources:
              kinds: ["Namespace"]
              operations: ["UPDATE"]
            subjects:
              - kind: Group
                name: platform:operate
      validate:
        message: "platform:operate는 managed-by=platform 네임스페이스만 고칠 수 있고, 그 표시를 바꿀 수 없다"
        deny:
          conditions:
            any:
              - key: "{{request.oldObject.metadata.labels.\"managed-by\" || ''}}"
                operator: NotEquals
                value: platform
              - key: "{{request.object.metadata.labels.\"managed-by\" || ''}}"
                operator: NotEquals
                value: platform
    - name: create-with-platform-label
      match:
        any:
          - resources:
              kinds: ["Namespace"]
              operations: ["CREATE"]
            subjects:
              - kind: Group
                name: platform:operate
      validate:
        message: "platform:operate가 만드는 네임스페이스는 managed-by=platform 표시가 있어야 한다"
        deny:
          conditions:
            any:
              - key: "{{request.object.metadata.labels.\"managed-by\" || ''}}"
                operator: NotEquals
                value: platform
---
# Z47: (4) 플랫폼 네임스페이스의 Pod 은 Pod Security "baseline" 을 지킨다 (privileged·hostPath·hostNetwork·hostPID·추가 capability 금지).
#     k3s 기본 Pod Security 는 privileged 라서, 이게 없으면 platform-operate-app 의 deployments:create 로 노드 탈출 Pod 을 띄울 수 있다.
#     Kyverno 는 Pod 규칙을 Deployment 등에도 자동으로 넓혀 적용한다 (autogen)
# DRAFT(ai): restricted 가 아니라 baseline. 차트(gitops/charts/app)·CNPG Pod 이 restricted 를 다 지키는지 k3d 에서 확인 전
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: platform-namespace-pod-security
spec:
  validationFailureAction: Enforce
  background: true
  rules:
    - name: baseline
      match:
        any:
          - resources:
              kinds: ["Pod"]
              namespaceSelector:
                matchLabels: { managed-by: platform }
      validate:
        podSecurity:
          level: baseline
          version: latest
