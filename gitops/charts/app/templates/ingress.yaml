{{- /* A4: workloads 일 땐 ingress.service 로 받을 서비스 이름을 지정 (없으면 옛 값 app.name) */}}
{{- /* 들어오는 길 두 가지. cloudflared: 인바운드 0 (Cloudflare LB 원본 = 터널). lb: ALB / GCE Ingress */}}
{{- if eq .Values.ingress.mode "cloudflared" }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.app.name }}-cloudflared
  labels: {{- include "app.labels" . | nindent 4 }}
spec:
  replicas: 2
  selector:
    matchLabels: { app.kubernetes.io/name: {{ .Values.app.name }}-cloudflared }
  template:
    metadata:
      labels: { app.kubernetes.io/name: {{ .Values.app.name }}-cloudflared }
    spec:
      containers:
        - name: cloudflared
          image: cloudflare/cloudflared:2025.9.1
          args: ["tunnel", "--no-autoupdate", "run", "--url", {{ printf "http://%s:80" (.Values.ingress.service | default .Values.app.name) | quote }}]
          env:
            - name: TUNNEL_TOKEN
              valueFrom: { secretKeyRef: { name: {{ .Values.ingress.tunnelTokenSecret }}, key: token } }
          resources: { requests: { cpu: 50m, memory: 64Mi }, limits: { memory: 128Mi } }
{{- else if eq .Values.ingress.mode "lb" }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Values.app.name }}
  labels: {{- include "app.labels" . | nindent 4 }}
  {{- if eq .Values.ingress.className "alb" }}
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/healthcheck-path: {{ .Values.probes.readiness | quote }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.hostname | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend: { service: { name: {{ .Values.ingress.service | default .Values.app.name }}, port: { number: 80 } } }
{{- end }}
