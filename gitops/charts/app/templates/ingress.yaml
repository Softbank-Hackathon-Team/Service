{{- /* 들어오는 길 두 가지. cloudflared: 인바운드 0 (Cloudflare LB 원본 = 터널). lb: ALB / GCE Ingress.
       PB-1: hosts[] = 명세 entry 그대로 (호스트·경로·대상 Service·포트). Builder 가 못 그리는 줄은 warnings 로 남긴다 */}}
{{- with .Values.ingress }}
{{- $ing := . }}
{{- $first := dict }}
{{- range $h := $ing.hosts }}{{- range $p := $h.paths }}{{- if not $first.service }}{{- $first = $p }}{{- end }}{{- end }}{{- end }}
{{- if and (eq $ing.mode "cloudflared") $first.service }}
{{- $side := dict }}
{{- with $ing.metrics }}{{- with .sidecar }}{{- $side = . }}{{- end }}{{- end }}
{{- if $side.image }}
{{- if not (regexMatch "^[^@ ]+@sha256:[0-9a-f]{64}$" $side.image) }}{{ fail "ingress.metrics.sidecar.image 는 digest 고정" }}{{ end }}
{{- if not (regexMatch "^https://[^/ ]+/[^ ]+$" $side.endpoint) }}{{ fail "ingress.metrics.sidecar.endpoint 는 https://<호스트>/<경로>" }}{{ end }}
{{- end }}
{{- /* DRAFT(ai): 토큰 방식 터널은 호스트별 길을 Cloudflare 쪽에서 정한다 → 여기선 첫 대상 하나로 보낸다.
       대상이 여럿이면 Builder 가 경고 줄을 띄운다 */}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $.Values.app.name }}-cloudflared
  labels: {{- include "app.labels" $ | nindent 4 }}
spec:
  replicas: 2
  selector:
    matchLabels: { app.kubernetes.io/name: {{ $.Values.app.name }}-cloudflared }
  template:
    metadata:
      {{- with $ing.metrics }}
      {{- if not (regexMatch "^[0-9a-fA-F-]{36}$" (toString .migration)) }}{{ fail "ingress.metrics.migration 은 이전 uuid" }}{{ end }}
      {{- if not (has .env (list "source" "target")) }}{{ fail "ingress.metrics.env 는 source 또는 target" }}{{ end }}
      {{- /* 트래픽 판정 지표 (#245): 고객 클러스터 수집기(onprem-agent metrics)가 이 표시로 파드를 찾고, 표시 값을 env·migration 라벨로 붙인다 */}}
      labels: { app.kubernetes.io/name: {{ $.Values.app.name }}-cloudflared, svc.platform/metrics: cloudflared }
      annotations:
        svc.platform/metrics-port: "2000"
        svc.platform/migration: {{ .migration | quote }}
        svc.platform/env: {{ .env | quote }}
      {{- else }}
      labels: { app.kubernetes.io/name: {{ $.Values.app.name }}-cloudflared }
      {{- end }}
    spec:
      containers:
        - name: cloudflared
          image: cloudflare/cloudflared:2025.9.1
          {{- if $side.image }}
          {{- /* 클라우드 도착: 수집기가 같은 파드라 127.0.0.1 로 충분하다. 파드 밖으로 열지 않아 NetworkPolicy 가 필요 없다 */}}
          args: ["tunnel", "--no-autoupdate", "--metrics", "127.0.0.1:2000", "run", "--url", {{ printf "http://%s:%v" $first.service $first.port | quote }}]
          {{- else if $ing.metrics }}
          {{- /* --metrics 는 tunnel 단계 옵션이라 run 앞. 파드 주소로 열어야 다른 파드(수집기)가 읽는다. 들어오는 길은 아래 NetworkPolicy 로 수집기만 */}}
          args: ["tunnel", "--no-autoupdate", "--metrics", "0.0.0.0:2000", "run", "--url", {{ printf "http://%s:%v" $first.service $first.port | quote }}]
          ports: [{ name: metrics, containerPort: 2000, protocol: TCP }]
          {{- else }}
          args: ["tunnel", "--no-autoupdate", "run", "--url", {{ printf "http://%s:%v" $first.service $first.port | quote }}]
          {{- end }}
          env:
            - name: TUNNEL_TOKEN
              valueFrom: { secretKeyRef: { name: {{ $ing.tunnelTokenSecret }}, key: token } }
          resources: { requests: { cpu: 50m, memory: 64Mi }, limits: { memory: 128Mi } }
        {{- if $side.image }}
        - name: metrics
          image: {{ $side.image }}
          args: ["--config=/etc/svc-metrics/config.yaml"]
          env:
            - name: POD_NAME
              valueFrom: { fieldRef: { fieldPath: metadata.name } }
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
            seccompProfile: { type: RuntimeDefault }
          volumeMounts:
            - { name: metrics-config, mountPath: /etc/svc-metrics, readOnly: true }
            - { name: metrics-token, mountPath: /var/run/svc-metric, readOnly: true }
          resources: { requests: { cpu: 20m, memory: 64Mi }, limits: { memory: 192Mi } }
      volumes:
        - name: metrics-config
          configMap: { name: {{ $.Values.app.name }}-cloudflared-metrics }
        {{- /* optional: 전환 중에 Secret 이 사라져도 cloudflared(입구)는 떠 있어야 한다. 수집기만 재시작한다. 처음 값이 없는 경우는 배포 전 비밀 점검이 막는다 */}}
        - name: metrics-token
          secret: { secretName: {{ $side.tokenSecret }}, optional: true, items: [{ key: token, path: token }] }
---
# 트래픽 판정 지표 수집기 설정 (#245). 온프레 수집기(deploy/helm/onprem-agent metrics)와 같은 변환, 긁는 대상만 같은 파드
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $.Values.app.name }}-cloudflared-metrics
  labels: {{- include "app.labels" $ | nindent 4 }}
data:
  config.yaml: |
    extensions:
      bearertokenauth:
        filename: /var/run/svc-metric/token
    receivers:
      prometheus:
        config:
          scrape_configs:
            - job_name: svc-cloudflared
              scrape_interval: 5s
              static_configs:
                - targets: ["127.0.0.1:2000"]
                  labels:
                    migration: {{ $ing.metrics.migration | quote }}
                    env: {{ $ing.metrics.env | quote }}
                    replica: ${env:POD_NAME}
              metric_relabel_configs:
                - { source_labels: [__name__], regex: 'cloudflared_tunnel_response_by_code(_total)?', action: keep }
                - { source_labels: [status_code], target_label: code }
                - { regex: status_code, action: labeldrop }
    processors:
      transform/svc:
        error_mode: ignore
        metric_statements:
          - context: metric
            statements:
              - 'set(name, "svc_ingress_requests_total") where name == "cloudflared_tunnel_response_by_code" or name == "cloudflared_tunnel_response_by_code_total"'
      batch:
        timeout: 2s
    exporters:
      otlphttp:
        metrics_endpoint: {{ $side.endpoint | quote }}
        auth: { authenticator: bearertokenauth }
    service:
      extensions: [bearertokenauth]
      telemetry:
        metrics: { level: none }
      pipelines:
        metrics:
          receivers: [prometheus]
          processors: [transform/svc, batch]
          exporters: [otlphttp]
        {{- else }}
{{- with $ing.metrics }}
---
# cloudflared 는 밖으로 나가는 연결만 쓴다 (터널). 들어오는 것은 지표 :2000 하나이고, 고객 클러스터 수집기 네임스페이스에서만 받는다.
#   지표 주소에는 /metrics 말고 /debug/pprof 같은 진단 경로도 있어 클러스터 전체에 열지 않는다
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $.Values.app.name }}-cloudflared-metrics
  labels: {{- include "app.labels" $ | nindent 4 }}
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/name: {{ $.Values.app.name }}-cloudflared }
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: {{ .collectorNamespace | default "svc-agent" }} } }
          podSelector: { matchLabels: { app.kubernetes.io/name: svc-metrics } }
      ports:
        - { protocol: TCP, port: 2000 }
{{- end }}
        {{- end }}
{{- else if eq $ing.mode "lb" }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $.Values.app.name }}
  labels: {{- include "app.labels" $ | nindent 4 }}
  {{- if eq $ing.className "alb" }}
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
  {{- end }}
spec:
  {{- with $ing.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- /* 명세 entry 의 tls(terminate) 호스트는 TLS 로 받는다. 인증서 Secret = <앱>-tls (값은 차트에 없다) */}}
  {{- $tls := list }}
  {{- range $h := $ing.hosts }}{{- if $h.tls }}{{- $tls = concat $tls $h.hostnames }}{{- end }}{{- end }}
  {{- if $tls }}
  tls:
    - hosts: {{- toYaml $tls | nindent 8 }}
      secretName: {{ printf "%s-tls" $.Values.app.name }}
  {{- end }}
  rules:
    {{- range $h := $ing.hosts }}
    {{- range $name := $h.hostnames }}
    - host: {{ $name | quote }}
      http:
        paths:
          {{- range $h.paths }}
          - path: {{ .path | quote }}
            pathType: {{ .pathType }}
            backend: { service: { name: {{ .service }}, port: { number: {{ .port }} } } }
          {{- end }}
    {{- end }}
    {{- end }}
{{- end }}
{{- end }}
