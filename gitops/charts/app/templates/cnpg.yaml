{{- /* 온프레: CloudNativePG 가 Postgres 를 클러스터 안에 만든다. PB-1: postgres[] 한 줄(mode cnpg) = Cluster 하나.
       이름·접속 서비스(<name>-rw)·비밀(<name>-app)은 Builder(onprem.ts cnpgName)가 정한 값 그대로.
       DRAFT(ai) O 스레드: replication.enabled=true 면 DB 이전에 필요한 것을 켠다.
         - enableSuperuserAccess: 도착(구독) 쪽은 CREATE SUBSCRIPTION 에 superuser 가 필요 → Secret <name>-superuser
         - managed.roles: REPLICATION 속성 계정. 비밀번호는 Secret <name>-repl (값은 차트에 없다. 스크립트/ESO 가 만든다)
         - max_replication_slots / max_wal_senders: fwd·rev 슬롯 2개 + 여유
       TODO(human): superuser 대신 PG16 pg_create_subscription 역할로 줄일지 (최소 권한) */}}
{{- /* CNPG-V2 DRAFT(ai): v2 값(irVersion "2")은 database 하나가 아니라 postgres 목록. mode cnpg 인 줄마다 Cluster 하나.
       이름·initdb(database·owner)·walStorage·resources·parameters 는 어댑터(onprem.ts)가 IR 에서 채운 값 그대로.
       replication 칸은 v1 과 같은 뜻 (DB 이전 스레드가 값에 넣을 때만) */}}
{{- range $pg := (.Values.postgres | default list) }}{{- if eq (toString $pg.mode) "cnpg" }}
{{- $repl := ($pg.replication | default dict) }}
---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: {{ required "postgres[].name" $pg.name }}
  labels: {{- include "app.labels" $ | nindent 4 }}
spec:
  instances: {{ $pg.instances | default 1 }}
  imageName: {{ printf "ghcr.io/cloudnative-pg/postgresql:%s" (toString (required "postgres[].majorVersion" $pg.majorVersion)) | quote }}
  storage: { size: {{ printf "%dGi" (int (required "postgres[].storageGb" $pg.storageGb)) | quote }} }
  {{- with $pg.walStorageGb }}
  walStorage: { size: {{ printf "%dGi" (int .) | quote }} }
  {{- end }}
  resources:
    {{- toYaml ($pg.resources | default (dict "requests" (dict "cpu" "500m" "memory" "1Gi") "limits" (dict "memory" "1Gi"))) | nindent 4 }}
  bootstrap:
    initdb: { database: {{ required "postgres[].database" $pg.database | quote }}, owner: {{ required "postgres[].owner" $pg.owner | quote }} }
  postgresql:
    parameters:
      {{- range $k, $v := ($pg.parameters | default dict) }}
      {{- if not (or (eq $k "wal_level") (and $repl.enabled (has $k (list "max_replication_slots" "max_wal_senders")))) }}
      {{ $k }}: {{ toString $v | quote }}
      {{- end }}
      {{- end }}
      wal_level: logical
      {{- if $repl.enabled }}
      max_replication_slots: "10"
      max_wal_senders: "10"
      {{- end }}
  {{- if $repl.enabled }}
  enableSuperuserAccess: true
  managed:
    roles:
      - name: {{ $repl.role | default "repl" | quote }}
        ensure: present
        login: true
        replication: true
        inRoles: [pg_read_all_data]
        passwordSecret: { name: {{ printf "%s-repl" $pg.name | quote }} }
  {{- end }}
{{- end }}{{- end }}
