{{- /* A4·PB-1 DRAFT(ai): workloads[] — 서비스·잡 여러 개를 한 차트(= Argo 앱 1개)로. 값 모양 = packages/contracts/src/chart-values.ts (ChartWorkload)
       Builder 가 ChartValues.parse 로 검사한 값만 온다. 없는 칸은 키 자체를 안 그린다 */}}
{{- $seenCfg := dict }}
{{- $seenSA := dict }}
{{- range $w := .Values.workloads }}
{{- $sa := $w.serviceAccount | default dict }}
{{- /* create: false (k8s 기본 "default" SA 등 클러스터에 이미 있는 것)는 안 만든다 */}}
{{- if and $sa.name $sa.create (not (hasKey $seenSA $sa.name)) }}
{{- $_ := set $seenSA $sa.name true }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $sa.name }}
  labels: {{- include "app.labels" $ | nindent 4 }}
  {{- with $sa.annotations }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
{{- /* PB-1: ConfigMap 이름 = 출발 이름 그대로 (env configMapKeyRef·envFrom 이 이 이름을 본다). 여러 워크로드가 같이 쓰면 한 번만 */}}
{{- range $c := ($w.configs | default list) }}
{{- if not (hasKey $seenCfg $c.name) }}
{{- $_ := set $seenCfg $c.name true }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $c.name }}
  labels: {{- include "app.labels" $ | nindent 4 }}
data: {{- toYaml ($c.data | default dict) | nindent 2 }}
{{- end }}
{{- end }}
{{- range $p := ($w.pvcs | default list) }}
---
{{- /* 빈 PVC. 출발 데이터는 안 따라온다 (어댑터가 경고 줄을 띄움) */}}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ printf "%s-%s" $w.name $p.name }}
  labels: {{- include "app.wlabels" (dict "root" $ "w" $w) | nindent 4 }}
spec:
  accessModes: {{- toYaml ($p.accessModes | default (list "ReadWriteOnce")) | nindent 4 }}
  {{- with $p.storageClassName }}
  storageClassName: {{ . }}
  {{- end }}
  resources:
    requests:
      storage: {{ $p.size | quote }}
{{- end }}
{{- if eq ($w.kind | default "service") "job" }}
{{- $j := $w.job | default dict }}
{{- if $j.schedule }}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ $w.name }}
  labels: {{- include "app.wlabels" (dict "root" $ "w" $w) | nindent 4 }}
spec:
  schedule: {{ $j.schedule | quote }}
  {{- with $j.timeZone }}
  timeZone: {{ . | quote }}
  {{- end }}
  {{- with $j.concurrencyPolicy }}
  concurrencyPolicy: {{ . }}
  {{- end }}
  {{- /* J-1: 잡 주인이 target 이 되기 전(컷오버 전)에는 도착 CronJob 을 멈춰 둔다 → 출발·도착이 같은 잡을 두 번 돌리지 않음.
         주인이 target 이면 출발 값(suspend) 그대로 */}}
  suspend: {{ if eq ($.Values.jobOwner | default "source") "target" }}{{ $j.suspend | default false }}{{ else }}true{{ end }}
  jobTemplate:
    spec:
      {{- if hasKey $j "backoffLimit" }}
      backoffLimit: {{ $j.backoffLimit }}
      {{- end }}
      {{- with $j.activeDeadlineSeconds }}
      activeDeadlineSeconds: {{ . }}
      {{- end }}
      template:
        metadata:
          labels: {{- include "app.wlabels" (dict "root" $ "w" $w) | nindent 12 }}
        spec: {{- include "app.wpod" (dict "root" $ "w" $w "restart" ($j.restartPolicy | default "OnFailure")) | nindent 10 }}
{{- else }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $w.name }}
  labels: {{- include "app.wlabels" (dict "root" $ "w" $w) | nindent 4 }}
spec:
  {{- if hasKey $j "backoffLimit" }}
  backoffLimit: {{ $j.backoffLimit }}
  {{- end }}
  {{- with $j.activeDeadlineSeconds }}
  activeDeadlineSeconds: {{ . }}
  {{- end }}
  template:
    metadata:
      labels: {{- include "app.wlabels" (dict "root" $ "w" $w) | nindent 8 }}
    spec: {{- include "app.wpod" (dict "root" $ "w" $w "restart" ($j.restartPolicy | default "OnFailure")) | nindent 6 }}
{{- end }}
{{- else }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $w.name }}
  labels: {{- include "app.wlabels" (dict "root" $ "w" $w) | nindent 4 }}
spec:
  {{- if and (hasKey $w "replicas") (not $w.scale) }}
  replicas: {{ $w.replicas }}
  {{- end }}
  {{- with $.Values.progressDeadlineSeconds }}
  progressDeadlineSeconds: {{ . }}
  {{- end }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ $.Values.app.name }}
      app.kubernetes.io/component: {{ $w.name | quote }}
  template:
    metadata:
      labels: {{- include "app.wlabels" (dict "root" $ "w" $w) | nindent 8 }}
    spec: {{- include "app.wpod" (dict "root" $ "w" $w) | nindent 6 }}
{{- /* PB-1: Service 는 services[] 한 줄에 하나 (출발 Service 이름·종류·포트 그대로). Headless = clusterIP: None */}}
{{- range $svc := ($w.services | default list) }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $svc.name }}
  labels: {{- include "app.wlabels" (dict "root" $ "w" $w) | nindent 4 }}
spec:
  {{- if eq $svc.type "Headless" }}
  clusterIP: None
  {{- else }}
  type: {{ $svc.type }}
  {{- end }}
  selector:
    app.kubernetes.io/name: {{ $.Values.app.name }}
    app.kubernetes.io/component: {{ $w.name | quote }}
  ports:
    {{- range $svc.ports }}
    - port: {{ .port }}
      targetPort: {{ .targetPort }}
      {{- with .name }}
      name: {{ . }}
      {{- end }}
      {{- with .protocol }}
      protocol: {{ . }}
      {{- end }}
    {{- end }}
{{- end }}
{{- with $w.scale }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ $w.name }}
  labels: {{- include "app.wlabels" (dict "root" $ "w" $w) | nindent 4 }}
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: {{ $w.name }} }
  minReplicas: {{ .min }}
  maxReplicas: {{ .max }}
  {{- with .cpuPct }}
  metrics:
    - type: Resource
      resource: { name: cpu, target: { type: Utilization, averageUtilization: {{ . }} } }
  {{- end }}
{{- end }}
{{- end }}
{{- end }}
