{{- /* A4: workloads[] 값이 있으면 workloads.yaml 이 대신 그린다 (옛 단일 값 길은 그대로) */}}
{{- if not .Values.workloads }}
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.app.name }}
  labels: {{- include "app.labels" . | nindent 4 }}
spec:
  selector: { app.kubernetes.io/name: {{ .Values.app.name }} }
  ports: [{ name: http, port: 80, targetPort: http }]
{{- end }}
