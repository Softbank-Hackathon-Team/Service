{{- /* 앱 시크릿: 클라우드 시크릿 저장소 → k8s Secret (ESO). 값은 차트에 없다 */}}
{{- if .Values.externalSecrets.refs }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.app.name }}-secrets
  labels: {{- include "app.labels" . | nindent 4 }}
spec:
  refreshInterval: 1h
  secretStoreRef: {{- toYaml .Values.externalSecrets.store | nindent 4 }}
  target: { name: {{ .Values.app.name }}-secrets }
  data:
    {{- range .Values.externalSecrets.refs }}
    - secretKey: {{ .name | quote }}
      remoteRef: { key: {{ .remoteKey | default (printf "%s-%s" $.Values.app.name (.name | lower | replace "_" "-")) | quote }} }
    {{- end }}
{{- end }}
{{- /* 클라우드 DB 비밀번호: 관리형 DB가 만든 시크릿 → <app>-db-app (CNPG와 같은 이름으로 맞춤) */}}
{{- /* Z66: database 가 null 이거나 mode 가 없으면(예: Z31 activeWriter 만 든 객체) DB 칸을 안 그린다 */}}
{{- with .Values.database }}{{- if .mode }}
{{- if eq .mode "external" }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $.Values.app.name }}-db-app
  labels: {{- include "app.labels" $ | nindent 4 }}
spec:
  refreshInterval: 1h
  secretStoreRef: {{- toYaml $.Values.externalSecrets.store | nindent 4 }}
  target: { name: {{ $.Values.app.name }}-db-app }
  data:
    - secretKey: password
      remoteRef:
        key: {{ .passwordSecret | quote }}
        {{- with .passwordProperty }}
        property: {{ . | quote }}
        {{- end }}
{{- end }}
{{- end }}{{- end }}
