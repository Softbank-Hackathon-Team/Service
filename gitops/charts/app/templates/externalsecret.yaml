{{- /* 앱 시크릿: 클라우드 시크릿 저장소 → k8s Secret (ESO). 값은 차트에 없다.
       PB-1: 비밀 하나 = ExternalSecret 하나. target 이름 = 출발 비밀 이름 그대로 (앱이 보는 이름 수정 0).
       keys 가 있으면 키마다 remoteRef.property, 비면 dataFrom.extract (원격 JSON 통째) */}}
{{- $es := .Values.externalSecrets | default dict }}
{{- range $s := ($es.secrets | default list) }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $s.name }}
  labels: {{- include "app.labels" $ | nindent 4 }}
spec:
  refreshInterval: 1h
  secretStoreRef: {{- toYaml $es.store | nindent 4 }}
  target:
    name: {{ $s.name }}
    {{- with $s.type }}
    template: { type: {{ . | quote }} }
    {{- end }}
  {{- if $s.keys }}
  data:
    {{- range $k := $s.keys }}
    - secretKey: {{ $k | quote }}
      remoteRef:
        key: {{ $s.remoteKey | quote }}
        property: {{ $k | quote }}
        {{- if has $k ($s.decode | default list) }}
        decodingStrategy: Base64
        {{- end }}
    {{- end }}
  {{- else }}
  dataFrom:
    - extract: { key: {{ $s.remoteKey | quote }} }
  {{- end }}
{{- end }}
{{- /* 클라우드 DB 비밀번호: 관리형 DB 가 만든 시크릿 → <앱>-<id>-app (온프레 CNPG <cluster>-app 과 같은 꼴) */}}
{{- range $db := (.Values.postgres | default list) }}
{{- if eq $db.mode "external" }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $db.secretName }}
  labels: {{- include "app.labels" $ | nindent 4 }}
spec:
  refreshInterval: 1h
  secretStoreRef: {{- toYaml $es.store | nindent 4 }}
  target: { name: {{ $db.secretName }} }
  data:
    - secretKey: password
      remoteRef:
        key: {{ $db.passwordSecret | quote }}
        {{- with $db.passwordProperty }}
        property: {{ . | quote }}
        {{- end }}
{{- end }}
{{- end }}
