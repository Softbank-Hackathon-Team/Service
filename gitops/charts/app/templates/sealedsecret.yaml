{{- /* 봉인 비밀 (sealedSecrets[], 선택): 사람 손 없이 비밀값을 클러스터에 넣는 길. 끌어오기(pull) 모델이라 플랫폼이 클러스터에 직접 쓰지 않는다.
       이전 역할 비밀번호(<cnpg>-migrate, kubernetes.io/basic-auth), 터널 SSH 키(dbTunnel.keySecret, 키 id),
       CNPG 서버 인증서·키(certificates.serverTLSSecret kubernetes.io/tls, serverCASecret ca.crt)가 여기로 온다.
       값은 클러스터 sealed-secrets 컨트롤러의 공개키로 암호화된 글자만 있다. 평문은 차트·git 에 없다.
       범위 = strict (기본, 주석 없음): 이름 + 네임스페이스에 묶여 봉인된다. 봉인할 때 --name <name> --namespace <values.namespace>.
       DRAFT(ai): namespace-wide·cluster-wide 주석은 그리지 않는다 (다른 이름·네임스페이스로 옮겨 풀 수 없게)
       풀린 Secret 에 cnpg.io/reload=true 를 단다: CNPG 는 이 라벨이 있는 Secret 만 지켜보다가 바뀌면 다시 맞춘다
       (관리 역할 비밀번호·서버 인증서). 없으면 이전마다 새로 파생한 <cnpg>-migrate 비밀번호를 CNPG 가 모르고 지나가
       두 번째 이전부터 svc_migrate 로그인이 실패했다 (2026-11-06 실측: pending-reconciliation 3분+, 라벨을 달자 10초 안에 반영).
       CNPG 가 안 쓰는 비밀(터널 키)에 붙어도 아무 일도 안 한다 */}}
{{- range $s := (.Values.sealedSecrets | default list) }}
{{- if not $s.encryptedData }}{{ fail (printf "sealedSecrets[%s].encryptedData 가 비었다 (봉인된 값이 하나 이상)" (toString $s.name)) }}{{ end }}
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: {{ required "sealedSecrets[].name" $s.name }}
  labels: {{- include "app.labels" $ | nindent 4 }}
spec:
  encryptedData: {{- toYaml $s.encryptedData | nindent 4 }}
  template:
    metadata:
      name: {{ $s.name }}
      labels: {{- include "app.labels" $ | nindent 8 }}
        cnpg.io/reload: "true"
    {{- with $s.type }}
    type: {{ . | quote }}
    {{- end }}
{{- end }}
