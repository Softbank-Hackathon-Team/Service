services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: platform_owner
      POSTGRES_PASSWORD: owner_pw
      POSTGRES_DB: platform
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U platform_owner -d platform"]
      interval: 2s
      timeout: 3s
      retries: 30
  # 마이그레이션 실행기 (Z9). 기록 표 migrate.applied 를 보고 안 들어간 파일만 넣는다
  # docker 초기화 폴더(docker-entrypoint-initdb.d)는 DB를 처음 만들 때만 돌아서, 새 번호가 생기면 db:reset(데이터 삭제)이 필요했다
  migrate:
    image: postgres:16-alpine
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_ADMIN_URL: postgres://platform_owner:owner_pw@db:5432/platform
    volumes:
      - ./db:/work/db:ro
      - ./tools:/work/tools:ro
    entrypoint: ["sh", "/work/tools/db-migrate.sh"]
    restart: "no"
volumes:
  pgdata:
