# 관측 도구 묶음 (선택). 기본 docker-compose.yml 은 건드리지 않는다
# 띄우기: docker compose -f docker-compose.observability.yml up -d
# api(지표 9464)·worker(지표 9465)는 맥에서 npm 으로 띄운 것을 host.docker.internal 로 긁는다
# Prometheus http://localhost:9090 , Grafana http://localhost:3001 (익명 보기 허용, 로그인 없이 대시보드)
# DRAFT(ai): 데모·리허설용. 클러스터판은 deploy/observability/kube-prometheus-stack.values.yaml
services:
  prometheus:
    image: prom/prometheus:v3.15.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=2d
    ports:
      - "127.0.0.1:9090:9090"   # Z47: 같은 와이파이의 다른 기기에 열지 않는다 (로그인 없음)
    volumes:
      - ./deploy/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
  grafana:
    image: grafana/grafana:13.2.5
    ports:
      - "127.0.0.1:3001:3000"   # Z47: 익명 보기라 내 컴퓨터 안에서만
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/migrations.json
    volumes:
      - ./deploy/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
