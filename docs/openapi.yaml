components:
  securitySchemes:
    bearerAuth:
      type: "http"
      scheme: "bearer"
      bearerFormat: "JWT"
      description: "POST /api/v1/auth/login 응답의 accessToken. 회사 번호는 토큰의 tid 클레임 (apps/api/src/plugins/auth.ts, Z93)"
    devTenant:
      type: "apiKey"
      in: "header"
      name: "x-dev-tenant"
      description: "시험 전용: DEV_AUTH=1 일 때만 회사 번호(uuid)를 그대로 받는다. 운영(NODE_ENV=production)에서는 꺼짐 (apps/api/src/plugins/auth.ts)"
  parameters:
    DevTenant:
      name: "x-dev-tenant"
      in: "header"
      required: false
      schema:
        type: "string"
        format: "uuid"
      description: "회사 번호. RLS가 이 값으로 행을 거른다"
    IdempotencyKey:
      name: "Idempotency-Key"
      in: "header"
      required: false
      schema:
        type: "string"
        pattern: "^[A-Za-z0-9_.:-]{8,200}$"
      description: "같은 키 재요청이면 첫 응답 재생 (응답 헤더 Idempotent-Replayed: true). 같은 키·다른 요청이면 409 IDEMPOTENCY_KEY_REUSED. 없으면 키 없이 처리 (DRAFT(ai), apps/api/src/plugins/idempotency.ts)"
  responses:
    E400:
      description: "요청 모양이 틀림"
      content:
        "application/json":
          schema:
            $ref: "#/components/schemas/ApiError"
    E401:
      description: "인증 없음"
      content:
        "application/json":
          schema:
            $ref: "#/components/schemas/ApiError"
    E404:
      description: "없음 (남의 회사 것도 RLS로 404)"
      content:
        "application/json":
          schema:
            $ref: "#/components/schemas/ApiError"
    E409:
      description: "상태·지문·잠금 충돌"
      content:
        "application/json":
          schema:
            $ref: "#/components/schemas/ApiError"
    E500:
      description: "서버 오류"
      content:
        "application/json":
          schema:
            $ref: "#/components/schemas/ApiError"
    E403:
      description: "터널로 온 쓰기 거부 (개발 헤더 인증일 때만)"
      content:
        "application/json":
          schema:
            $ref: "#/components/schemas/ApiError"
    E429:
      description: "속도 제한 초과 (retry-after 초 뒤 다시)"
      content:
        "application/json":
          schema:
            $ref: "#/components/schemas/ApiError"
  schemas:
    Accepted:
      type: "object"
      properties:
        id:
          type: "string"
          format: "uuid"
          pattern: "^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$"
      required:
        - "id"
      additionalProperties: false
    AccuracyField:
      type: "object"
      properties:
        component:
          type: "string"
          minLength: 1
          maxLength: 200
        field:
          type: "string"
          minLength: 1
          maxLength: 60
        result:
          $ref: "#/components/schemas/AccuracyResult"
