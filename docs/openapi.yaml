# 생성 파일: npx tsx tools/openapi/gen-openapi.ts (손으로 고치지 말 것)
openapi: "3.1.0"
info:
  title: "멀티클라우드 이전 제어판 API"
  version: "0.1.0-skeleton"
  license:
    name: "UNLICENSED (해커톤 비공개)"
    identifier: "LicenseRef-Proprietary"
  description: "코드에서 생성한 문서다 (tools/openapi/gen-openapi.ts). 손으로 고치지 말고 경로의 Zod 스키마를 고친 뒤 다시 생성한다.\n인증은 POST /api/v1/auth/login(이메일+비밀번호)이 주는 Bearer 접근 토큰(JWT HS256, 15분)이다. 갱신은 HttpOnly 쿠키 svc_refresh 로 POST /api/v1/auth/refresh. x-dev-tenant 헤더는 DEV_AUTH=1(시험 전용)일 때만, NODE_ENV=production이면 절대 안 받는다 (Z93).\nx-response-source: supplement 인 응답은 경로에 response 스키마가 없어 처리기 코드를 읽고 보충한 것이다.\n상태를 바꾸는 POST는 x-state-transition에 전이 번호를 적었다."
servers:
  - url: "http://localhost:3000"
    description: "로컬 (API_PORT 기본값)"
tags:
  - name: "migrations"
    description: "이전 한 건의 생성·조회·시작"
  - name: "plans"
    description: "계획서와 승인 (planHash 바인딩)"
  - name: "environments"
    description: "연결된 환경"
  - name: "cost"
    description: "비용 추정 (순수 계산)"
  - name: "control"
    description: "비상 버튼: 되돌리기·취소"
  - name: "report"
    description: "증적 리포트"
  - name: "docs"
    description: "이 API 문서"
  - name: "auth"
    description: "로그인·토큰 갱신·로그아웃 (Z93)"
  - name: "health"
    description: "쿠버네티스 프로브"
paths:
  "/api/v1/agent/register":
    post:
      operationId: "postAgentRegister"
      tags:
        - "agent"
      summary: "/api/v1/agent/register"
      description: "코드: apps/api/src/routes/agent-enroll.ts"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              type: "object"
              properties:
                enrollToken:
                  type: "string"
                  maxLength: 100
              required:
                - "enrollToken"
              additionalProperties: false
      security:
        - bearerAuth: []
        - devTenant: []
      parameters:
        - $ref: "#/components/parameters/DevTenant"
      responses:
        "201":
          description: "OK"
          content:
            "application/json":
              schema:
                type: "object"
                properties:
                  envId:
                    type: "string"
                    format: "uuid"
                    pattern: "^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$"
                  keyId:
                    type: "string"
                  secret:
                    type: "string"
                required:
                  - "envId"
                  - "keyId"
                  - "secret"
                additionalProperties: false
        "400":
          $ref: "#/components/responses/E400"
          description: "BAD_REQUEST (Zod 검증 실패)"
        "401":
          $ref: "#/components/responses/E401"
          description: "UNAUTHENTICATED (Bearer 토큰 없음·만료, DEV_AUTH=1 이면 x-dev-tenant 없음)"
        "409":
          $ref: "#/components/responses/E409"
          description: "ApiError"
        "429":
          $ref: "#/components/responses/E429"
          description: "RATE_LIMITED (회사·읽기/쓰기별 분당 한도, retry-after 헤더, Z52)"
        "500":
          $ref: "#/components/responses/E500"
          description: "INTERNAL"
        "503":
          $ref: "#/components/responses/E503"
          description: "ApiError"
