# 팀 환경 등록부 — 누가 어떤 환경을 쓰는지 (칸마다 회사를 나눈다: slot-1 은 dev-company, slot-2~5 는 각자 회사)
# 상태: AI 초안
#
# 이 파일을 읽는 것:
#   - 플랫폼 API: 회원가입(초대 코드) 때 그 칸의 environments 를 회사 안에 만든다 (이름으로 찾고, 있으면 건드리지 않음)
#   - tools/team-env.sh <slot>: 그 칸의 GCP 연결 명령을 값까지 채워 찍는다 (--check 는 읽기 전용 확인,
#     source 는 출발 샘플 앱 명령: gcp 는 gcp.original_project·region, aws 는 cluster·region·name(kubectl 컨텍스트)·db_instance)
#   모양을 바꾸면 두 곳이 같이 깨진다. 키는 아래 것만 쓴다 (environments 항목의 키: name·provider·region·cluster·db_instance·gcp·notes.
#   같은 목록: packages/contracts/src/team-registry.ts TeamEnvironment, 모르는 키가 있으면 명부 전체를 거부한다)
#   db_instance: aws 환경만, 선택. 출발 샘플 RDS 식별자(소문자·숫자·-). team-env.sh source 가 이 이름으로만 RDS 를 찾는다
#     (없으면 DB·app·seed 줄을 안 찍는다. 같은 AWS 계정에 플랫폼 자기 DB platform-db 가 있어 "리전의 첫 PostgreSQL" 은 고르지 않는다)
#
# 규칙
#   1. 환경 하나에 진행 중인 이전은 하나다 (플랫폼 잠금). 남이 쓰는 환경으로 이전을 만들면 409 로 거부된다
#   2. AWS 계정 하나에 환경을 여럿 연결해도 된다. 새로 연결하는 환경은 역할 이름에 환경 꼬리가 붙어(svc-observe-<환경 8자>)
#      연결 스택이 안 부딪힌다 (infra/onboarding/README.md "한 계정에 여럿"). 계정의 두 번째 스택부터는 권한 경계를 만들지 않는다
#      (CreateBoundaryPolicy=false, env:connect 가 알아서). 이미 연결된 옛 환경(꼬리 없음)은 그대로 같이 써도 된다
#   3. GCP 전용 프로젝트(dedicated_project)는 한 칸에만 적는다. 환경 층 이름(VPC·GKE platform-target 등)이 프로젝트 안에서
#      고정이라 둘이 같은 프로젝트를 쓰면 서로의 자원과 부딪힌다. 다른 칸의 원래 프로젝트(original_project)로도 쓰지 않는다
#      (GCP 출발 샘플도 platform-target 이름을 쓴다)
#   4. 공유 환경(slot-1)을 쓰기 전에 팀 채널에 "<환경 이름> 지금부터 씀" 을 알리고, 끝나면 "다 씀" 을 남긴다
#   5. 계정 번호·IP·비밀값·초대 코드 원문은 적지 않는다. AWS 는 계정 별칭만 notes 에 적는다
#
# 칸 채우는 법: login 은 운영자가 정한 아이디, signup_code_sha256 은 운영자가 채운다 (비어 있으면 그 칸은 가입 닫힘)
#   environments 는 자기 클라우드에서 연결할 환경을 적는다. 이름은 회사 안에서 하나여야 한다 (예: s2-src-aws, s2-gcp)
# 회사: 칸의 tenant 가 그 칸 사람의 회사다 (비우면 아래 맨 위 tenant). 회사가 다르면 회사 단위 큐 몫(TENANT_QUEUE_SHARE)·환경 목록·환경 이름이 따로라
#   다섯 명이 서로 막지 않는다. GCP 연결의 PLATFORM_SA 는 회사마다 다르다 (t-<md5(회사 번호) 앞 28자>, tools/team-env.sh 가 계산)
