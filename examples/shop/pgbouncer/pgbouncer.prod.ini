; Z64 실환경(AWS EKS / GCP GKE) 예시. 값은 예시, 비밀값 없음. 【미확인】 실클러스터에서 아직 안 띄움
; 배치: 앱과 같은 클러스터에 Deployment 2개(+ PodDisruptionBudget). 앱 DB_HOST = 이 Service 이름
; 제어 옆차(pgbouncer-control.ts)는 같은 파드의 두 번째 컨테이너. 대상 줄 파일은 emptyDir 공유
[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
unix_socket_dir =

; ---- 풀링 ----
; transaction: PAUSE 가 "트랜잭션 끝"에서 돌아온다. session 이면 앱이 연결을 끊을 때까지 PAUSE 가 안 끝난다 (공식 문서 usage.html)
pool_mode = transaction
max_client_conn = 500
default_pool_size = 20
reserve_pool_size = 5
; 트랜잭션 풀링에서도 프로토콜 수준 prepared statement 를 지원 (1.21+, 기본 200)
max_prepared_statements = 200

; ---- 붙잡기 안전망 ----
; 붙잡힌 앱 연결이 서버를 기다리는 최대 시간. 제어 옆차 holdMax(25초) 뒤에 걸리게 30초 (Z38 P-3)
query_wait_timeout = 30
; 트랜잭션을 연 채 쉬는 연결이 PAUSE 를 막지 않게 (C2 펜스 전에 끊긴다)
idle_transaction_timeout = 30
query_timeout = 0
server_lifetime = 3600
server_idle_timeout = 600

; ---- 인증 (앱 → PgBouncer) ----
auth_type = scram-sha-256
; Secret 을 파일로 마운트. 내용: "app" "<비밀번호 또는 SCRAM 비밀>" 한 줄 + 관리 계정 한 줄
; auth_query 는 RDS·Cloud SQL 이 pg_authid 를 막아 쓰기 어렵다 (공식 문서 config.html). 출발·도착 둘 다 같은 app 비밀번호여야 한다
auth_file = /etc/pgbouncer/secret/userlist.txt
admin_users = pgb_admin
; search_path 는 DB 의 ALTER ROLE app SET search_path 로 정한다. 앱이 보내는 options 는 무시
ignore_startup_parameters = extra_float_digits,options

; ---- TLS ----
; 앱 → PgBouncer: 같은 클러스터 안이지만 암호화 (NetworkPolicy 로 앱 파드만 허용)
client_tls_sslmode = require
client_tls_key_file = /etc/pgbouncer/tls/tls.key
client_tls_cert_file = /etc/pgbouncer/tls/tls.crt
; PgBouncer → DB: 컷오버 중 출발 클러스터 앱이 도착 클라우드 DB 로 가므로 클라우드 사이 구간이 생긴다. 이름까지 검증
server_tls_sslmode = verify-full
; RDS 전역 묶음 + Cloud SQL 서버 CA 를 한 파일로 합쳐 둔다
server_tls_ca_file = /etc/pgbouncer/tls/db-ca-bundle.pem

; ---- 관측 ----
log_connections = 0
log_disconnections = 0
stats_period = 30

; 대상 줄 파일. 제어 옆차가 다시 쓰고 RELOAD 한다. 내용 예: shop = host=<도착 DB 주소> port=5432 dbname=shop
%include /etc/pgbouncer/dyn/databases.ini
