; Z64 로컬 시험용 PgBouncer 설정 (run-z31.sh MODE=pgbouncer 가 @DIR@ 을 바꿔 쓴다)
; 실환경 예시는 examples/shop/pgbouncer/pgbouncer.ini (TLS·auth_query 포함)
[pgbouncer]
listen_addr = 127.0.0.1
listen_port = 6432
unix_socket_dir =
pidfile = @DIR@/pgbouncer.pid
auth_type = scram-sha-256
auth_file = @DIR@/userlist.txt
admin_users = pgb_admin
pool_mode = transaction
max_client_conn = 200
default_pool_size = 20
; 붙잡힌 앱 연결이 기다리는 최대 시간. 제어 옆차의 holdMax(15초) 뒤 안전망
query_wait_timeout = 20
; 앱이 보내는 options(-c search_path=...) 는 무시한다. search_path 는 DB 의 ALTER ROLE app SET search_path 로 이미 정해져 있다
ignore_startup_parameters = extra_float_digits,options
server_tls_sslmode = disable
client_tls_sslmode = disable
log_connections = 0
log_disconnections = 0
%include @DIR@/databases.ini
