# PR 마다 도는 가벼운 검사 하나. npm ci·DB·도커 없이 1분 안에 끝난다.
#   기능 단위 PR 들이 서로 의존해서, PR 하나만으로는 타입 검사·시험이 통과할 수 없다.
#   그래서 PR 에서는 "그 PR 이 바꾼 파일" 만 본다. 무거운 검사(ci.yml)는 main 에 들어간 뒤 돈다.
#   보는 것:
#     1) 커밋하면 안 되는 파일 (.env, *.tfstate, *.tfvars, 개인 키)
#     2) 추가된 줄의 비밀값 모양 (AWS 키, 개인 키 블록, Anthropic·GitHub·Slack 토큰). 시험 폴더·예시 키는 뺀다
#     3) 바뀐 JSON 파일이 깨지지 않았는지
name: pr-check

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: pr-check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  pr-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: 바뀐 파일 목록
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git diff --name-only --diff-filter=ACMR "$BASE_SHA" HEAD > "$RUNNER_TEMP/changed.txt"
          echo "바뀐 파일 $(wc -l < "$RUNNER_TEMP/changed.txt")개" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: 커밋하면 안 되는 파일
        run: |
          bad=$(grep -E '(^|/)\.env(\..+)?$|\.tfstate(\..+)?$|\.tfvars$|(^|/)id_(rsa|ed25519)$|\.pem$|\.p12$' "$RUNNER_TEMP/changed.txt" \
            | grep -vE '(^|/)\.env\.example$' || true)
          if [ -n "$bad" ]; then
            echo "::error::커밋하면 안 되는 파일이 들어 있다"
            echo "$bad"
            exit 1
          fi
      - name: 비밀값 모양 검사
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          pattern='AKIA[0-9A-Z]{16}|-----BEGIN ([A-Z]+ )?PRIVATE KEY-----|sk-ant-[A-Za-z0-9_-]{20,}|gh[pousr]_[A-Za-z0-9]{36}|xox[baprs]-[A-Za-z0-9-]{10,}'
          # 시험 폴더는 일부러 가짜 키를 넣어 "새지 않는지" 확인하므로 뺀다. 문서용 예시 키(…EXAMPLE…)도 허용
          allow='EXAMPLE|AKIAABCDEFGHIJKLMNOP'
          hits=$(git diff -U0 "$BASE_SHA" HEAD -- . ':(exclude)**/test/**' ':(exclude)**/*.test.ts' ':(exclude)**/*.it.ts' \
            | grep -E '^\+' | grep -vE '^\+\+\+ ' | grep -nE "$pattern" | grep -vE "$allow" || true)
          if [ -n "$hits" ]; then
            echo "::error::비밀값으로 보이는 줄이 추가됐다 (값은 출력하지 않음)"
            echo "$hits" | cut -d: -f1 | head -20 | sed 's/^/diff 줄 /'
            exit 1
          fi
      - name: 바뀐 JSON 문법
        run: |
          fail=0
          while IFS= read -r f; do
            case "$f" in *.json) ;; *) continue ;; esac
            case "$f" in */tsconfig*.json|tsconfig*.json) continue ;; esac
            node -e 'JSON.parse(require("fs").readFileSync(process.argv[1], "utf8"))' "$f" \
              || { echo "::error file=$f::JSON 문법 오류"; fail=1; }
          done < "$RUNNER_TEMP/changed.txt"
          exit $fail
